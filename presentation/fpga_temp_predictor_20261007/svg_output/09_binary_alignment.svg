<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_09" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">DATAPATH SIZING &amp; ALIGNMENT</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Binary Point Alignment &amp; 35-Bit Overflow-Free Proof</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Radix point normalization across products, base shifts, and mathematical headroom verification</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="card_radix_alignment" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">RADIX POINT ALIGNMENT ACROSS COMPUTATION</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">1. Subtractor Differences: D1 &amp; D2</text>
    <text x="80" y="235" fill="#8D99AE" font-size="13">• T(t) is Q8.8 (16 bits) | T(t-24) is Q8.8 (16 bits)</text>
    <text x="80" y="255" fill="#48CAE4" font-size="13" font-weight="bold">• Difference: Signed 17-bit Q9.8 (1 sign bit added to prevent wrap)</text>
    
    <text x="80" y="295" fill="#FFFFFF" font-size="15" font-weight="bold">2. DSP Multiplication: P1 &amp; P2</text>
    <text x="80" y="320" fill="#8D99AE" font-size="13">• Coeff A/B is Signed 16-bit Q2.14 (scale 2^14 = 16,384)</text>
    <text x="80" y="340" fill="#8D99AE" font-size="13">• Product: Q2.14 × Q9.8 = </text>
    <text x="270" y="340" fill="#F77F00" font-size="14" font-weight="bold">Signed 33-bit Q11.22 (scale 2^22 = 4,194,304)</text>
    
    <text x="80" y="380" fill="#FFFFFF" font-size="15" font-weight="bold">3. Anchor &amp; Bias Left-Shift: Radix Alignment</text>
    <text x="80" y="405" fill="#8D99AE" font-size="13">• Anchor T(t-21) and Offset C are natively in Q8.8 (scale 2^8).</text>
    <text x="80" y="425" fill="#8D99AE" font-size="13">• To add with Products (scale 2^22), they must be shifted left by:</text>
    <text x="80" y="445" fill="#48CAE4" font-size="14" font-weight="bold">  22 - 8 = 14 bits!</text>
    
    <rect x="80" y="470" width="525" height="145" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="495" fill="#48CAE4" font-size="13" font-weight="bold">HARDWARE RADIX EQUALIZATION IN VERILOG:</text>
    <text x="100" y="522" fill="#FFFFFF" font-size="12">wire signed [34:0] base_aligned = (T21_extended + C_extended) &lt;&lt; 14;</text>
    <text x="100" y="545" fill="#8D99AE" font-size="12">• Left-shift by 14 scales 2^8 → 2^22 seamlessly at zero gate cost.</text>
    <text x="100" y="568" fill="#8D99AE" font-size="12">• Now Products and Base share the identical Q22 fractional radix!</text>
    <text x="100" y="595" fill="#10B981" font-size="12" font-weight="bold">→ All terms ready for bit-exact 35-bit accumulation.</text>
  </g>
  <g id="card_overflow_proof" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="675" y="162" fill="#48CAE4" font-size="14" font-weight="bold">MATHEMATICAL PROOF: 35-BIT HEADROOM</text>
    
    <text x="675" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Accumulator Format: Signed 35-bit Q13.22</text>
    <text x="675" y="235" fill="#8D99AE" font-size="13">• Sign: [34] | Integer: [33:22] (12 bits) | Fraction: [21:0] (22 bits)</text>
    
    <rect x="675" y="255" width="525" height="150" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="695" y="280" fill="#F77F00" font-size="13" font-weight="bold">WORST-CASE THEORETICAL MAGNITUDE BOUND:</text>
    <text x="695" y="305" fill="#FFFFFF" font-size="12">• Max |Diff| = 2^16 - 1 = 65,535 (extreme -128°C to +127.99°C swing)</text>
    <text x="695" y="325" fill="#FFFFFF" font-size="12">• Max |Coeff| = 2^15 = 32,768</text>
    <text x="695" y="345" fill="#FFFFFF" font-size="12">• Max |Base| = 32,768 &lt;&lt; 14 = 5.368 × 10^8</text>
    <text x="695" y="370" fill="#48CAE4" font-size="13" font-weight="bold">Max Sum S_max = 2 × (32,768 × 65,535) + 2 × (5.368 × 10^8)</text>
    <text x="695" y="392" fill="#10B981" font-size="14" font-weight="bold">S_max = 5.369 × 10^9</text>
    
    <rect x="675" y="420" width="525" height="195" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1"/>
    <text x="695" y="445" fill="#10B981" font-size="14" font-weight="bold">HEADROOM &amp; OVERFLOW CONCLUSION:</text>
    <text x="695" y="475" fill="#FFFFFF" font-size="13">• Capacity of Signed 35-bit int: </text>
    <text x="910" y="475" fill="#48CAE4" font-size="14" font-weight="bold">2^34 - 1 ≈ 1.718 × 10^10</text>
    
    <text x="695" y="505" fill="#FFFFFF" font-size="13">• Headroom Factor: </text>
    <text x="830" y="505" fill="#10B981" font-size="16" font-weight="bold">1.718×10^10 / 5.369×10^9 = 3.19×</text>
    
    <text x="695" y="535" fill="#8D99AE" font-size="12">• The accumulator has over 3.19x headroom beyond the absolute</text>
    <text x="695" y="555" fill="#8D99AE" font-size="12">  worst-case theoretical input possible in the 16-bit domain.</text>
    <text x="695" y="585" fill="#10B981" font-size="13" font-weight="bold">→ 100% Mathematically Proven: Intermediate wrap-around is impossible!</text>
  </g>
  <g id="ftr_09" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Accumulator Sizing: 35-bit Q13.22 provides 3.19x safety headroom over maximum possible theoretical sum</text>
  </g>
</svg>
