<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_12" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">RTL MICRO-ARCHITECTURE EXPLORATION</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Dual Architectural Paradigms: Speed vs. Resource Trade-Off</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Spatial parallelism vs. temporal multiplexing implemented under an identical mathematical contract</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="table_dual_arch" data-pptx-bounds="60 135 1160 375">
    <rect x="60" y="135" width="1160" height="375" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="1160" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">SIDE-BY-SIDE ARCHITECTURAL COMPARISON MATRIX</text>
    
    <!-- Table Header Row -->
    <rect x="80" y="190" width="1120" height="32" rx="4" fill="#0B132B"/>
    <text x="100" y="211" fill="#8D99AE" font-size="12" font-weight="bold">ARCHITECTURAL ATTRIBUTE</text>
    <text x="400" y="211" fill="#48CAE4" font-size="12" font-weight="bold">SPEED CORE (temp_predictor_speed.v)</text>
    <text x="800" y="211" fill="#10B981" font-size="12" font-weight="bold">RESOURCE CORE (temp_predictor_resource.v)</text>
    
    <!-- Row 1: Paradigm -->
    <rect x="80" y="226" width="1120" height="34" rx="4" fill="#1E2D4A" fill-opacity="0.4"/>
    <text x="100" y="248" fill="#FFFFFF" font-size="12">Datapath Architecture</text>
    <text x="400" y="248" fill="#48CAE4" font-size="12" font-weight="bold">Fully Pipelined Feed-Forward Datapath</text>
    <text x="800" y="248" fill="#10B981" font-size="12" font-weight="bold">Time-Multiplexed FSM Shared Datapath</text>
    
    <!-- Row 2: Initiation Interval -->
    <rect x="80" y="264" width="1120" height="34" rx="4" fill="#162238"/>
    <text x="100" y="286" fill="#FFFFFF" font-size="12">Initiation Interval (II)</text>
    <text x="400" y="286" fill="#48CAE4" font-size="13" font-weight="bold">II = 1 clock cycle / sample</text>
    <text x="800" y="286" fill="#F77F00" font-size="13" font-weight="bold">II &lt;= 10 clock cycles / sample</text>
    
    <!-- Row 3: Latency -->
    <rect x="80" y="302" width="1120" height="34" rx="4" fill="#1E2D4A" fill-opacity="0.4"/>
    <text x="100" y="324" fill="#FFFFFF" font-size="12">Execution Latency (L)</text>
    <text x="400" y="324" fill="#FFFFFF" font-size="12">5 clock cycles (100 ns @ 50 MHz)</text>
    <text x="800" y="324" fill="#FFFFFF" font-size="12">8 to 10 clock cycles (160–200 ns @ 50 MHz)</text>
    
    <!-- Row 4: Multipliers -->
    <rect x="80" y="340" width="1120" height="34" rx="4" fill="#162238"/>
    <text x="100" y="362" fill="#FFFFFF" font-size="12">Embedded Multiplier Blocks</text>
    <text x="400" y="362" fill="#F77F00" font-size="13" font-weight="bold">2 Dedicated Blocks (17x16)</text>
    <text x="800" y="362" fill="#10B981" font-size="13" font-weight="bold">1 Shared Block (Time-Multiplexed)</text>
    
    <!-- Row 5: Subtractors -->
    <rect x="80" y="378" width="1120" height="34" rx="4" fill="#1E2D4A" fill-opacity="0.4"/>
    <text x="100" y="400" fill="#FFFFFF" font-size="12">17-Bit Subtractor ALUs</text>
    <text x="400" y="400" fill="#FFFFFF" font-size="12">2 Dedicated Subtractors</text>
    <text x="800" y="400" fill="#10B981" font-size="12" font-weight="bold">1 Shared Subtractor (MUX Controlled)</text>
    
    <!-- Row 6: Control Logic -->
    <rect x="80" y="416" width="1120" height="34" rx="4" fill="#162238"/>
    <text x="100" y="438" fill="#FFFFFF" font-size="12">Control Structure &amp; Handshake</text>
    <text x="400" y="438" fill="#FFFFFF" font-size="12">6-Stage Valid Shift Register (No stall)</text>
    <text x="800" y="438" fill="#FFFFFF" font-size="12">10-State One-Hot FSM with sample_ready</text>
    
    <!-- Row 7: Peak Throughput -->
    <rect x="80" y="454" width="1120" height="42" rx="4" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="480" fill="#FFFFFF" font-size="13" font-weight="bold">Peak Throughput @ 50 MHz</text>
    <text x="400" y="480" fill="#48CAE4" font-size="15" font-weight="bold">50,000,000 Samples / sec</text>
    <text x="800" y="480" fill="#10B981" font-size="15" font-weight="bold">5,000,000 Samples / sec</text>
  </g>
  <g id="box_equivalence" data-pptx-bounds="60 525 1160 115">
    <rect x="60" y="525" width="1160" height="115" rx="10" fill="#1E2D4A" stroke="#48CAE4" stroke-width="1"/>
    <text x="85" y="555" fill="#48CAE4" font-size="13" font-weight="bold">MATHEMATICAL EQUIVALENCE &amp; VERIFICATION INVARIANT:</text>
    <text x="85" y="582" fill="#FFFFFF" font-size="13">
      Despite radically different micro-architectures (spatial parallelism vs temporal sharing), both cores implement the exact
    </text>
    <text x="85" y="604" fill="#FFFFFF" font-size="13">
      same Q8.8 / Q2.14 numerical contract, radix alignment, and sat16 clamping: <tspan fill="#10B981" font-weight="bold">Guaranteed 100% bit-exact equivalence!</tspan>
    </text>
    <text x="85" y="626" fill="#8D99AE" font-size="11">
      Validated by driving identical stimulus into both cores concurrently and comparing cycle-accurate results in SystemVerilog.
    </text>
  </g>
  <g id="ftr_12" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Micro-Architecture Trade-Off: Speed Core achieves 50 MSps (II=1); Resource Core halves multiplier usage to 1 block</text>
  </g>
</svg>
