<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_15" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">SEQUENTIAL FSM CONTROLLER</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Resource Core: 10-State FSM &amp; Multiplier Time-Multiplexing</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Time-multiplexing a single 17x16 multiplier across two operations to save 50% DSP silicon</text>
  </g>
  <g id="fsm_bubble_diagram" data-pptx-bounds="60 135 700 500">
    <rect x="60" y="135" width="700" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="700" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">10-STATE TIME-MULTIPLEXED SEQUENTIAL FSM</text>
    
    <!-- State Bubbles: Row 1 (Top) -->
    <circle cx="110" cy="240" r="30" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="110" y="244" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">IDLE</text>
    
    <circle cx="235" cy="240" r="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="235" y="244" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">S0: CAP</text>
    
    <circle cx="360" cy="240" r="30" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="360" y="244" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">S1: SUB1</text>
    
    <circle cx="485" cy="240" r="30" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="485" y="244" fill="#D97706" font-size="10" font-weight="bold" text-anchor="middle">S2: MULT1</text>
    
    <circle cx="610" cy="240" r="30" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="610" y="244" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">S3: SUB2</text>
    
    <!-- Row 1 Transition Arrows -->
    <line x1="140" y1="240" x2="205" y2="240" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="265" y1="240" x2="330" y2="240" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="390" y1="240" x2="455" y2="240" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="515" y1="240" x2="580" y2="240" stroke="#2563EB" stroke-width="1.8"/>
    
    <!-- Vertical transition down: S3 to S4 -->
    <line x1="610" y1="270" x2="610" y2="330" stroke="#2563EB" stroke-width="1.8"/>
    
    <!-- State Bubbles: Row 2 (Bottom) -->
    <circle cx="610" cy="360" r="30" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="610" y="364" fill="#D97706" font-size="10" font-weight="bold" text-anchor="middle">S4: MULT2</text>
    
    <circle cx="485" cy="360" r="30" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="485" y="364" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">S5: SUM</text>
    
    <circle cx="360" cy="360" r="30" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="360" y="364" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">S6: ACC</text>
    
    <circle cx="235" cy="360" r="30" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="235" y="364" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">S7: SAT16</text>
    
    <circle cx="110" cy="360" r="30" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="110" y="364" fill="#16A34A" font-size="10" font-weight="bold" text-anchor="middle">S8: DONE</text>
    
    <!-- Row 2 Transition Arrows -->
    <line x1="580" y1="360" x2="515" y2="360" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="455" y1="360" x2="390" y2="360" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="330" y1="360" x2="265" y2="360" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="205" y1="360" x2="140" y2="360" stroke="#2563EB" stroke-width="1.8"/>
    
    <!-- Vertical transition back up to IDLE -->
    <line x1="110" y1="330" x2="110" y2="270" stroke="#16A34A" stroke-width="1.8"/>
    <text x="80" y="302" fill="#16A34A" font-size="9" font-weight="bold">valid_out</text>
    
    <!-- State Function Table -->
    <rect x="80" y="420" width="660" height="195" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="445" fill="#1E3A8A" font-size="12" font-weight="bold">FSM Sequential Schedule:</text>
    <text x="95" y="470" fill="#334155" font-size="11">• S0: Latch sample; push into 25-stage history buffer</text>
    <text x="95" y="495" fill="#334155" font-size="11">• S1–S2: D1 = T(t)-T24; shared mult computes P1 = a·D1</text>
    <text x="95" y="520" fill="#334155" font-size="11">• S3–S4: D2 = T(t)-T3; shared mult computes P2 = b·D2</text>
    <text x="95" y="545" fill="#334155" font-size="11">• S5–S6: Reused ALU sums P1+P2, adds anchor T(t-21) and bias c</text>
    <text x="95" y="570" fill="#334155" font-size="11">• S7–S8: Shift &gt;&gt;&gt; 14, clamp sat16, assert forecast_valid</text>
  </g>
  <g id="shared_mult_mux" data-pptx-bounds="780 135 440 500">
    <rect x="780" y="135" width="440" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="780" y="135" width="440" height="42" rx="8" fill="#F1F5F9"/>
    <text x="800" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">MULTIPLIER SHARING ARCHITECTURE</text>
    
    <text x="800" y="205" fill="#0F172A" font-size="13" font-weight="bold">Operand Multiplexer Routing:</text>
    
    <rect x="800" y="225" width="400" height="150" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="815" y="250" fill="#1E3A8A" font-size="12" font-weight="bold">2:1 Operand Mux Logic (ols_shared_datapath.v):</text>
    
    <rect x="815" y="268" width="370" height="42" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
    <text x="825" y="292" fill="#D97706" font-size="11" font-weight="bold">State S2:  mult_in_a = D1;  mult_in_b = COEF_A;</text>
    
    <rect x="815" y="320" width="370" height="42" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
    <text x="825" y="344" fill="#D97706" font-size="11" font-weight="bold">State S4:  mult_in_a = D2;  mult_in_b = COEF_B;</text>
    
    <!-- Shared DSP Multiplier Box -->
    <rect x="800" y="395" width="400" height="90" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1000" y="425" fill="#1E3A8A" font-size="13" font-weight="bold" text-anchor="middle">SINGLE 17×16 EMBEDDED DSP MULTIPLIER</text>
    <text x="1000" y="448" fill="#334155" font-size="11" text-anchor="middle">Altera Cyclone II 9-bit Blocks: 2 units (vs 4 in Speed Core)</text>
    <text x="1000" y="470" fill="#16A34A" font-size="12" font-weight="bold" text-anchor="middle">50% DSP Silicon Footprint Saved!</text>
    
    <!-- Silicon Profile -->
    <rect x="800" y="500" width="400" height="115" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="815" y="525" fill="#1E3A8A" font-size="12" font-weight="bold">Hardware Footprint Impact:</text>
    <text x="815" y="548" fill="#334155" font-size="11">• Speed Core: 4 9-bit DSP blocks (2 dedicated multipliers)</text>
    <text x="815" y="570" fill="#334155" font-size="11">• Resource Core: 2 9-bit DSP blocks (1 shared multiplier)</text>
    <text x="815" y="595" fill="#16A34A" font-size="11" font-weight="bold">• Area Savings: -50% DSP blocks, -42.7% LEs (236 LEs total)</text>
  </g>
  <g id="ftr_15" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Time-multiplexing a single multiplier cuts Cyclone II DSP footprint by 50% with minimal control overhead.</text>
  </g>
</svg>
