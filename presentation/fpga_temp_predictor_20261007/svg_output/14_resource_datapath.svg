<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_14" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">TIME-MULTIPLEXED DATAPATH</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Resource-Optimized Datapath: Hardware Sharing via MUXing</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Cutting DSP blocks and subtractor ALUs in half through sequential operand scheduling</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="card_hw_sharing" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">HARDWARE REUSE STRATEGY (ols_shared_datapath.v)</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">1. Shared 17-Bit Subtractor ALU</text>
    <text x="80" y="235" fill="#8D99AE" font-size="13">• Controlled via single select signal: diff_sel_b</text>
    <rect x="80" y="245" width="525" height="55" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="95" y="268" fill="#F77F00" font-size="12" font-weight="bold">Cycle A (diff_sel_b = 0):</text>
    <text x="255" y="268" fill="#FFFFFF" font-size="12">D1 = T(t) - T(t-24)  [Inter-day trend]</text>
    <text x="95" y="288" fill="#10B981" font-size="12" font-weight="bold">Cycle B (diff_sel_b = 1):</text>
    <text x="255" y="288" fill="#FFFFFF" font-size="12">D2 = T(t) - T(t-3)   [Short-term gradient]</text>
    
    <text x="80" y="325" fill="#FFFFFF" font-size="15" font-weight="bold">2. Shared 17x16-Bit DSP Multiplier Block</text>
    <text x="80" y="350" fill="#8D99AE" font-size="13">• Controlled via single select signal: multiply_sel_b</text>
    <rect x="80" y="360" width="525" height="55" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="95" y="383" fill="#F77F00" font-size="12" font-weight="bold">Cycle A (multiply_sel_b = 0):</text>
    <text x="280" y="383" fill="#FFFFFF" font-size="12">P1 = A · D1  (Coeff A = 12214)</text>
    <text x="95" y="403" fill="#10B981" font-size="12" font-weight="bold">Cycle B (multiply_sel_b = 1):</text>
    <text x="280" y="403" fill="#FFFFFF" font-size="12">P2 = B · D2  (Coeff B = 150)</text>
    
    <text x="80" y="440" fill="#FFFFFF" font-size="15" font-weight="bold">3. Shared 35-Bit Accumulator Unit</text>
    <text x="80" y="465" fill="#8D99AE" font-size="13">• Operates sequentially across 4 dedicated accumulation states:</text>
    <text x="80" y="485" fill="#48CAE4" font-size="12">• Load P1 → Add P2 → Add Anchor &lt;&lt; 14 → Add Bias Offset &lt;&lt; 14</text>
    
    <rect x="80" y="510" width="525" height="105" rx="8" fill="#1E2D4A" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="535" fill="#10B981" font-size="13" font-weight="bold">SILICON SAVINGS DELIVERED:</text>
    <text x="100" y="560" fill="#FFFFFF" font-size="13">• Eliminates 1 entire embedded DSP multiplier block (-50%).</text>
    <text x="100" y="582" fill="#FFFFFF" font-size="13">• Eliminates 1 dedicated 17-bit subtractor ALU (-50%).</text>
    <text x="100" y="604" fill="#48CAE4" font-size="12" font-weight="bold">Total core logic reduced from ~320 LEs to ~245 LEs (-23.4%)!</text>
  </g>
  <g id="card_history_lock" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="675" y="162" fill="#F77F00" font-size="14" font-weight="bold">HISTORY BUFFER STATE LOCKING (temp_history_buffer.v)</text>
    
    <text x="675" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">The Multi-Cycle Tap Corruption Hazard:</text>
    <text x="675" y="235" fill="#8D99AE" font-size="13">• In the Speed core, history shifts every cycle because II = 1.</text>
    <text x="675" y="255" fill="#8D99AE" font-size="13">• In the Resource core, computation spans 8 to 10 clock cycles.</text>
    
    <rect x="675" y="275" width="525" height="110" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1"/>
    <text x="695" y="300" fill="#EF4444" font-size="13" font-weight="bold">HAZARD WITHOUT BUFFER LOCK:</text>
    <text x="695" y="325" fill="#FFFFFF" font-size="12">If new samples enter the buffer while FSM is at ST_MUL_B,</text>
    <text x="695" y="347" fill="#FFFFFF" font-size="12">taps T(t-3), T(t-21), and T(t-24) would shift mid-computation,</text>
    <text x="695" y="370" fill="#EF4444" font-size="13" font-weight="bold">corrupting the mathematical alignment and resulting in garbage!</text>
    
    <rect x="675" y="405" width="525" height="210" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1"/>
    <text x="695" y="432" fill="#10B981" font-size="13" font-weight="bold">THE BUFFER LOCK ARCHITECTURE:</text>
    <text x="695" y="460" fill="#FFFFFF" font-size="13">• History buffer shifts ONLY on initial sample_valid handshake.</text>
    <text x="695" y="485" fill="#FFFFFF" font-size="13">• FSM deasserts sample_ready throughout all computation states.</text>
    <text x="695" y="510" fill="#8D99AE" font-size="12">• Internal 25-stage register array locks frozen until output valid pulse.</text>
    <text x="695" y="535" fill="#8D99AE" font-size="12">• Taps T(t), T(t-3), T(t-21), T(t-24) remain 100% stable and stationary.</text>
    <text x="695" y="565" fill="#48CAE4" font-size="12" font-weight="bold">• Hardware verified across 10,000 back-to-back burst cycles</text>
    <text x="695" y="590" fill="#10B981" font-size="12" font-weight="bold">  with zero tap drift or data corruption.</text>
  </g>
  <g id="ftr_14" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Resource Sharing: Single 17x16 multiplier &amp; subtractor reused across cycles; history buffer locked during execution</text>
  </g>
</svg>
