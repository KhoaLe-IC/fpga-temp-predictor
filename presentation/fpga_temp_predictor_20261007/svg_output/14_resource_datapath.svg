<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_14" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">DIGITAL SIGNAL TIMING &amp; HANDSHAKE</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Speed Core: Cycle-Accurate Timing Waveforms &amp; Handshake</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Cycle-by-cycle register pipeline propagation and deterministic 5-cycle latency</text>
  </g>
  <g id="timing_waveform_box" data-pptx-bounds="60 135 1160 500">
    <rect x="60" y="135" width="1160" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="1160" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">DIGITAL SIGNAL TIMING WAVEFORM (CYCLE T0 TO T7)</text>
    
    <!-- Waveform Canvas -->
    <rect x="80" y="195" width="1120" height="300" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Cycle Vertical Guidelines (8 Cycles: T0 to T7, step=115) -->
    <text x="295" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T0 [IN]</text>
    <text x="410" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T1</text>
    <text x="525" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T2</text>
    <text x="640" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T3</text>
    <text x="755" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T4</text>
    <text x="870" y="215" fill="#16A34A" font-size="11" font-weight="bold">Cycle T5 [OUT]</text>
    <text x="985" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T6</text>
    <text x="1100" y="215" fill="#64748B" font-size="11" font-weight="bold">Cycle T7</text>
    
    <line x1="240" y1="220" x2="240" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="355" y1="220" x2="355" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="470" y1="220" x2="470" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="585" y1="220" x2="585" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="700" y1="220" x2="700" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="815" y1="220" x2="815" y2="480" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="930" y1="220" x2="930" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="1045" y1="220" x2="1045" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Trace 1: clk (50 MHz) -->
    <text x="100" y="250" fill="#1E3A8A" font-size="12" font-weight="bold">clk (50MHz)</text>
    <path d="M 240,255 L 297,255 L 297,235 L 355,235 L 355,255 L 412,255 L 412,235 L 470,235 L 470,255 L 527,255 L 527,235 L 585,235 L 585,255 L 642,255 L 642,235 L 700,235 L 700,255 L 757,255 L 757,235 L 815,235 L 815,255 L 872,255 L 872,235 L 930,235 L 930,255 L 987,255 L 987,235 L 1045,235 L 1045,255 L 1102,255 L 1102,235 L 1160,235" 
          fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
          
    <!-- Trace 2: sample_valid -->
    <text x="100" y="295" fill="#2563EB" font-size="12" font-weight="bold">sample_valid</text>
    <path d="M 240,300 L 250,300 L 255,280 L 350,280 L 355,300 L 1160,300" fill="none" stroke="#2563EB" stroke-width="2"/>
    
    <!-- Trace 3: temp_in[15:0] -->
    <text x="100" y="340" fill="#0F172A" font-size="12" font-weight="bold">temp_in[15:0]</text>
    <polygon points="255,335 345,335 355,345 345,355 255,355 245,345" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="300" y="348" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">T(t) [Q8.8]</text>
    <line x1="355" y1="345" x2="1160" y2="345" stroke="#64748B" stroke-width="1"/>
    
    <!-- Trace 4: Pipeline Stages Active -->
    <text x="100" y="390" fill="#4F46E5" font-size="12" font-weight="bold">Pipeline Flow</text>
    <!-- S0 at T0 -->
    <rect x="255" y="375" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
    <text x="300" y="391" fill="#4F46E5" font-size="10" font-weight="bold" text-anchor="middle">S0: Cap</text>
    <!-- S1 at T1 -->
    <rect x="370" y="375" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
    <text x="415" y="391" fill="#4F46E5" font-size="10" font-weight="bold" text-anchor="middle">S1: Diff</text>
    <!-- S2 at T2 -->
    <rect x="485" y="375" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
    <text x="530" y="391" fill="#4F46E5" font-size="10" font-weight="bold" text-anchor="middle">S2: Mult</text>
    <!-- S3 at T3 -->
    <rect x="600" y="375" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
    <text x="645" y="391" fill="#4F46E5" font-size="10" font-weight="bold" text-anchor="middle">S3: Sum</text>
    <!-- S4 at T4 -->
    <rect x="715" y="375" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
    <text x="760" y="391" fill="#4F46E5" font-size="10" font-weight="bold" text-anchor="middle">S4: Acc</text>
    <!-- S5 at T5 -->
    <rect x="830" y="375" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
    <text x="875" y="391" fill="#4F46E5" font-size="10" font-weight="bold" text-anchor="middle">S5: Sat</text>
    
    <!-- Trace 5: forecast_valid -->
    <text x="100" y="435" fill="#16A34A" font-size="12" font-weight="bold">forecast_valid</text>
    <path d="M 240,440 L 825,440 L 830,420 L 920,420 L 925,440 L 1160,440" fill="none" stroke="#16A34A" stroke-width="2.5"/>
    
    <!-- Trace 6: forecast_out[15:0] -->
    <text x="100" y="475" fill="#16A34A" font-size="12" font-weight="bold">forecast_out[15:0]</text>
    <polygon points="830,465 915,465 925,475 915,485 830,485 820,475" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="872" y="478" fill="#16A34A" font-size="11" font-weight="bold" text-anchor="middle">T_hat(t+3)</text>
    
    <!-- Bottom Timing Metrics Panel -->
    <rect x="80" y="510" width="1120" height="105" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="535" fill="#1E3A8A" font-size="12" font-weight="bold">Pipeline Latency &amp; Handshake Contract:</text>
    <text x="100" y="558" fill="#334155" font-size="12">• Deterministic Latency: Exactly 5 clock cycles (100 ns at 50.0 MHz system clock).</text>
    <text x="100" y="580" fill="#334155" font-size="12">• Streaming Throughput: II = 1 (1 sample/clock, 50 MSps) with zero backpressure bubbles.</text>
    <text x="100" y="602" fill="#16A34A" font-size="12" font-weight="bold">• Formal Verification: SV assertion `assert (##5 forecast_valid)` verified bit-exact.</text>
  </g>
  <g id="ftr_14" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Cycle-accurate timing waveform proves deterministic 5-cycle latency with zero bubble or backpressure stalls.</text>
  </g>
</svg>
