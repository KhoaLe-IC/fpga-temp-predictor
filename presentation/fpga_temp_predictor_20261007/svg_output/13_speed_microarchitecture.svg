    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">6-STAGE REGISTER PIPELINE DATAPATH (temp_predictor_speed.v)</text>
    
    <!-- 6 Stage Horizontal Boxes -->
    <rect x="80" y="195" width="170" height="175" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1.5"/>
    <rect x="80" y="195" width="170" height="32" rx="8" fill="#1E2D4A"/>
    <text x="95" y="217" fill="#48CAE4" font-size="12" font-weight="bold">STAGE 0</text>
    <text x="95" y="248" fill="#FFFFFF" font-size="13" font-weight="bold">Capture &amp; History</text>
    <text x="95" y="280" fill="#F77F00" font-size="11">25-entry shift reg</text>
    <text x="95" y="310" fill="#10B981" font-size="11">T(t), T3, T21, T24</text>
    <rect x="90" y="335" width="150" height="24" rx="4" fill="#162238"/>
    <text x="100" y="352" fill="#8D99AE" font-size="11">Reg Stage 0</text>
    <line x1="253" y1="282" x2="265" y2="282" stroke="#48CAE4" stroke-width="2"/>
