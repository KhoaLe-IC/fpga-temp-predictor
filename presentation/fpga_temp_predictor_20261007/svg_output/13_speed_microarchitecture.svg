    <rect x="80" y="390" width="1120" height="60" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="415" fill="#FFFFFF" font-size="12" font-weight="bold">Pipelining Principle: </text>
    <text x="235" y="415" fill="#8D99AE" font-size="12">Registers slice long combinational delay paths into 6 balanced stages.</text>
    <text x="100" y="437" fill="#48CAE4" font-size="12" font-weight="bold">Valid Pulse Flow: </text>
    <text x="215" y="437" fill="#8D99AE" font-size="12">sample_valid enters Stage 0 and propagates through a 6-bit shift register, emerging as forecast_valid at Stage 5.</text>
  </g>
  <g id="card_speed_perf" data-pptx-bounds="60 480 565 155">
    <rect x="60" y="480" width="565" height="155" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="480" width="565" height="36" rx="10" fill="#1E2D4A"/>
    <text x="80" y="504" fill="#48CAE4" font-size="13" font-weight="bold">THROUGHPUT &amp; TIMING METRICS</text>
    
    <text x="80" y="535" fill="#FFFFFF" font-size="13">• Initiation Interval (II): </text>
    <text x="235" y="535" fill="#10B981" font-size="14" font-weight="bold">1 cycle (100% throughput line rate)</text>
    
    <text x="80" y="560" fill="#FFFFFF" font-size="13">• Latency (L): </text>
    <text x="175" y="560" fill="#8D99AE" font-size="13">5 clock cycles (100 ns from sample_in to forecast_out)</text>
    
    <text x="80" y="585" fill="#FFFFFF" font-size="13">• Peak Streaming Rate: </text>
    <text x="235" y="585" fill="#48CAE4" font-size="14" font-weight="bold">50.0 MSamples / second @ 50 MHz clock</text>
    
    <text x="80" y="612" fill="#F77F00" font-size="12" font-weight="bold">• Backpressure: Zero backpressure (sample_ready tied permanently to 1).</text>
  </g>
  <g id="card_speed_cost" data-pptx-bounds="655 480 565 155">
    <rect x="655" y="480" width="565" height="155" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="480" width="565" height="36" rx="10" fill="#1E2D4A"/>
    <text x="675" y="504" fill="#F77F00" font-size="13" font-weight="bold">SILICON RESOURCE CONSUMPTION</text>
    
    <text x="675" y="535" fill="#FFFFFF" font-size="13">• Embedded DSP Multipliers: </text>
    <text x="875" y="535" fill="#F77F00" font-size="13" font-weight="bold">2 blocks (17x16-bit)</text>
    
    <text x="675" y="560" fill="#FFFFFF" font-size="13">• Dedicated Subtractors &amp; Adders: </text>
    <text x="905" y="560" fill="#8D99AE" font-size="13">2 subtractors + 2 adders</text>
    
    <text x="675" y="585" fill="#FFFFFF" font-size="13">• Total Cyclone II Logic Elements: </text>
    <text x="895" y="585" fill="#48CAE4" font-size="13" font-weight="bold">~320 LEs (&lt;1% of EP2C35)</text>
    
    <text x="675" y="612" fill="#10B981" font-size="12" font-weight="bold">• Target Application: High-rate multi-sensor radar &amp; streaming DSP.</text>
  </g>
  <g id="ftr_13" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Pipelined Throughput: Peak 50 MSamples/sec at 50 MHz clock; 5-cycle deterministic latency with zero input stalls</text>
  </g>
