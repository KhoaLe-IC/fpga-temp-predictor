<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_13" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">PIPELINED MICRO-ARCHITECTURE</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Speed-Optimized Core: 6-Stage Pipelined Datapath (II = 1)</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">High-throughput streaming datapath capable of processing one new temperature sample every single clock cycle</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="pipeline_diagram" data-pptx-bounds="60 135 1160 330">
