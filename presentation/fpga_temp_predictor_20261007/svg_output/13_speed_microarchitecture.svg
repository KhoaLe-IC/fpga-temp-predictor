    <text x="283" y="217" fill="#48CAE4" font-size="12" font-weight="bold">STAGE 1</text>
    <text x="283" y="248" fill="#FFFFFF" font-size="13" font-weight="bold">Parallel Diff</text>
    <text x="283" y="280" fill="#F77F00" font-size="11">Dual 17-bit ALUs</text>
    <text x="283" y="310" fill="#10B981" font-size="11">D1, D2 = Q9.8</text>
    <rect x="278" y="335" width="150" height="24" rx="4" fill="#162238"/>
    <text x="288" y="352" fill="#8D99AE" font-size="11">Reg Stage 1</text>
    <line x1="441" y1="282" x2="453" y2="282" stroke="#48CAE4" stroke-width="2"/>
    <polygon points="453,278 459,282 453,286" fill="#48CAE4"/>
    <rect x="456" y="195" width="170" height="175" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1.5"/>
    <rect x="456" y="195" width="170" height="32" rx="8" fill="#1E2D4A"/>
    <text x="471" y="217" fill="#48CAE4" font-size="12" font-weight="bold">STAGE 2</text>
    <text x="471" y="248" fill="#FFFFFF" font-size="13" font-weight="bold">Parallel Mult</text>
    <text x="471" y="280" fill="#F77F00" font-size="11">Dual 17x16 DSP</text>
    <text x="471" y="310" fill="#10B981" font-size="11">P1=A·D1, P2=B·D2</text>
    <rect x="466" y="335" width="150" height="24" rx="4" fill="#162238"/>
    <text x="476" y="352" fill="#8D99AE" font-size="11">Reg Stage 2</text>
    <line x1="629" y1="282" x2="641" y2="282" stroke="#48CAE4" stroke-width="2"/>
    <polygon points="641,278 647,282 641,286" fill="#48CAE4"/>
    <rect x="644" y="195" width="170" height="175" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1.5"/>
    <rect x="644" y="195" width="170" height="32" rx="8" fill="#1E2D4A"/>
    <text x="659" y="217" fill="#48CAE4" font-size="12" font-weight="bold">STAGE 3</text>
    <text x="659" y="248" fill="#FFFFFF" font-size="13" font-weight="bold">Product Sum</text>
    <text x="659" y="280" fill="#F77F00" font-size="11">34-bit Adder</text>
    <text x="659" y="310" fill="#10B981" font-size="11">sum_prod = P1+P2</text>
    <rect x="654" y="335" width="150" height="24" rx="4" fill="#162238"/>
    <text x="664" y="352" fill="#8D99AE" font-size="11">Reg Stage 3</text>
