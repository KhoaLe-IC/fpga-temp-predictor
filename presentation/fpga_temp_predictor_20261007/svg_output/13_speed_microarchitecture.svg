<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_13" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">PIPELINED MICRO-ARCHITECTURE</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Speed Core: 6-Stage Pipelined Datapath Schematic (II = 1)</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Dedicated registers, dual DSP units, and zero-bubble streaming</text>
  </g>
  <g id="rtl_schematic_box" data-pptx-bounds="60 135 1160 500">
    <rect x="60" y="135" width="1160" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="1160" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">6-STAGE REGISTER PIPELINE DATAPATH (temp_predictor_speed.v)</text>
    
    <!-- Stage 0: Tap Extraction (x=80, w=165) -->
    <rect x="80" y="195" width="165" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="80" y="195" width="165" height="30" rx="6" fill="#F1F5F9"/>
    <text x="95" y="215" fill="#1E3A8A" font-size="12" font-weight="bold">STAGE 0</text>
    <text x="95" y="245" fill="#0F172A" font-size="13" font-weight="bold">Tap Capture</text>
    <text x="95" y="272" fill="#334155" font-size="11">25-Sample Buffer</text>
    <text x="95" y="295" fill="#334155" font-size="11">T(t), T24, T3, T21</text>
    <text x="95" y="320" fill="#1E3A8A" font-size="11" font-weight="bold">Bus: 16b (Q8.8)</text>
    <rect x="90" y="390" width="145" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="162" y="415" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">[D | Q] REG S0</text>
    <polygon points="158,435 166,435 162,427" fill="#1E3A8A"/>
    
    <!-- Stage 1: Dual Subtractors (x=270, w=165) -->
    <rect x="270" y="195" width="165" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="270" y="195" width="165" height="30" rx="6" fill="#F1F5F9"/>
    <text x="285" y="215" fill="#1E3A8A" font-size="12" font-weight="bold">STAGE 1</text>
    <text x="285" y="245" fill="#0F172A" font-size="13" font-weight="bold">Dual ALUs [-]</text>
    <text x="285" y="272" fill="#334155" font-size="11">D1 = T(t) - T24</text>
    <text x="285" y="295" fill="#334155" font-size="11">D2 = T(t) - T3</text>
    <text x="285" y="320" fill="#D97706" font-size="11" font-weight="bold">Bus: 17b (Q9.8)</text>
    <rect x="280" y="390" width="145" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="352" y="415" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">[D | Q] REG S1</text>
    <polygon points="348,435 356,435 352,427" fill="#1E3A8A"/>
    
    <!-- Stage 2: Dual Multipliers (x=460, w=165) -->
    <rect x="460" y="195" width="165" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="460" y="195" width="165" height="30" rx="6" fill="#F1F5F9"/>
    <text x="475" y="215" fill="#1E3A8A" font-size="12" font-weight="bold">STAGE 2</text>
    <text x="475" y="245" fill="#0F172A" font-size="13" font-weight="bold">Dual DSPs [×]</text>
    <text x="475" y="272" fill="#334155" font-size="11">P1 = a · D1</text>
    <text x="475" y="295" fill="#334155" font-size="11">P2 = b · D2</text>
    <text x="475" y="320" fill="#4F46E5" font-size="11" font-weight="bold">Bus: 33b (Q11.22)</text>
    <rect x="470" y="390" width="145" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="542" y="415" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">[D | Q] REG S2</text>
    <polygon points="538,435 546,435 542,427" fill="#1E3A8A"/>
    
    <!-- Stage 3: Product Tree (x=650, w=165) -->
    <rect x="650" y="195" width="165" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="650" y="195" width="165" height="30" rx="6" fill="#F1F5F9"/>
    <text x="665" y="215" fill="#1E3A8A" font-size="12" font-weight="bold">STAGE 3</text>
    <text x="665" y="245" fill="#0F172A" font-size="13" font-weight="bold">Adder Tree [+]</text>
    <text x="665" y="272" fill="#334155" font-size="11">P = P1 + P2</text>
    <text x="665" y="295" fill="#334155" font-size="11">Pass Base Reg</text>
    <text x="665" y="320" fill="#D97706" font-size="11" font-weight="bold">Bus: 34b (Q12.22)</text>
    <rect x="660" y="390" width="145" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="732" y="415" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">[D | Q] REG S3</text>
    <polygon points="728,435 736,435 732,427" fill="#1E3A8A"/>
    
    <!-- Stage 4: Accumulator (x=840, w=165) -->
    <rect x="840" y="195" width="165" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="840" y="195" width="165" height="30" rx="6" fill="#F1F5F9"/>
    <text x="855" y="215" fill="#1E3A8A" font-size="12" font-weight="bold">STAGE 4</text>
    <text x="855" y="245" fill="#0F172A" font-size="13" font-weight="bold">Accumulator [+]</text>
    <text x="855" y="272" fill="#334155" font-size="11">S = P + Base</text>
    <text x="855" y="295" fill="#334155" font-size="11">Aligned to Radix 22</text>
    <text x="855" y="320" fill="#2563EB" font-size="11" font-weight="bold">Bus: 35b (Q13.22)</text>
    <rect x="850" y="390" width="145" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="922" y="415" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">[D | Q] REG S4</text>
    <polygon points="918,435 926,435 922,427" fill="#1E3A8A"/>
    
    <!-- Stage 5: Shift &amp; Sat16 (x=1030, w=165) -->
    <rect x="1030" y="195" width="165" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="1030" y="195" width="165" height="30" rx="6" fill="#F1F5F9"/>
    <text x="1045" y="215" fill="#1E3A8A" font-size="12" font-weight="bold">STAGE 5</text>
    <text x="1045" y="245" fill="#0F172A" font-size="13" font-weight="bold">Shift &amp; Sat16</text>
    <text x="1045" y="272" fill="#334155" font-size="11">S_sh = S &gt;&gt;&gt; 14</text>
    <text x="1045" y="295" fill="#334155" font-size="11">sat16 [-128..+128°C]</text>
    <text x="1045" y="320" fill="#16A34A" font-size="11" font-weight="bold">Bus: 16b (Q8.8)</text>
    <rect x="1040" y="390" width="145" height="50" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="1112" y="415" fill="#16A34A" font-size="11" font-weight="bold" text-anchor="middle">[D | Q] OUT REG</text>
    <polygon points="1108,435 1116,435 1112,427" fill="#16A34A"/>
    
    <!-- Flow Connectors -->
    <line x1="245" y1="415" x2="280" y2="415" stroke="#2563EB" stroke-width="2"/>
    <line x1="435" y1="415" x2="470" y2="415" stroke="#2563EB" stroke-width="2"/>
    <line x1="625" y1="415" x2="660" y2="415" stroke="#2563EB" stroke-width="2"/>
    <line x1="815" y1="415" x2="850" y2="415" stroke="#2563EB" stroke-width="2"/>
    <line x1="1005" y1="415" x2="1040" y2="415" stroke="#2563EB" stroke-width="2"/>
    
    <!-- Bottom Technical Summary -->
    <rect x="80" y="475" width="1115" height="140" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="502" fill="#1E3A8A" font-size="12" font-weight="bold">Pipeline Timing &amp; Throughput Integrity:</text>
    <text x="100" y="528" fill="#334155" font-size="11">• Throughput: II = 1 (1 sample/clock, 50 MSps @ 50 MHz, 0 bubbles)</text>
    <text x="100" y="551" fill="#334155" font-size="11">• Timing: Stage 2 multiplier critical path (6.4 ns, 142.3 MHz F_max)</text>
    <text x="100" y="574" fill="#334155" font-size="11">• Latency: L = 5 cycles (100 ns @ 50 MHz from accept edge)</text>
    <text x="100" y="598" fill="#16A34A" font-size="11" font-weight="bold">• Saturation: Stage 5 clamps shifted accumulator to [-128°C, +128°C]</text>
  </g>
  <g id="ftr_13" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">6-stage pipelining isolates arithmetic operations to achieve 142.3 MHz F_max and sustained II = 1 throughput.</text>
