    <text x="847" y="248" fill="#FFFFFF" font-size="13" font-weight="bold">Accumulation</text>
    <text x="847" y="280" fill="#F77F00" font-size="11">35-bit Adder</text>
    <text x="847" y="310" fill="#10B981" font-size="11">accum = sum+base</text>
    <rect x="842" y="335" width="150" height="24" rx="4" fill="#162238"/>
    <text x="852" y="352" fill="#8D99AE" font-size="11">Reg Stage 4</text>
    <line x1="1005" y1="282" x2="1017" y2="282" stroke="#48CAE4" stroke-width="2"/>
    <polygon points="1017,278 1023,282 1017,286" fill="#48CAE4"/>
    <rect x="1020" y="195" width="170" height="175" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1.5"/>
    <rect x="1020" y="195" width="170" height="32" rx="8" fill="#1E2D4A"/>
    <text x="1035" y="217" fill="#48CAE4" font-size="12" font-weight="bold">STAGE 5</text>
    <text x="1035" y="248" fill="#FFFFFF" font-size="13" font-weight="bold">Scale &amp; Sat</text>
    <text x="1035" y="280" fill="#F77F00" font-size="11">Shift >>> 14</text>
    <text x="1035" y="310" fill="#10B981" font-size="11">sat16 → forecast</text>
    <rect x="1030" y="335" width="150" height="24" rx="4" fill="#162238"/>
