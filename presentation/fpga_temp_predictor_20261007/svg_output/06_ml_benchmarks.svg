<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_06" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">ALGORITHM EXPLORATION &amp; BENCHMARKS</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Machine Learning Benchmark Suite: Held-Out Test Evaluation</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Comparison of 5 candidate architectures trained on 2021–2023 and evaluated on 2024–2025 unseen telemetry</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="table_benchmarks" data-pptx-bounds="60 135 760 500">
    <rect x="60" y="135" width="760" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="760" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">BENCHMARK ON UNSEEN HELD-OUT DATASET (2024–2025)</text>
    
    <!-- Table Header Row -->
    <rect x="80" y="195" width="720" height="34" rx="4" fill="#0B132B"/>
    <text x="95" y="217" fill="#8D99AE" font-size="12" font-weight="bold">MODEL ARCHITECTURE</text>
    <text x="320" y="217" fill="#8D99AE" font-size="12" font-weight="bold">PARAMS</text>
    <text x="410" y="217" fill="#8D99AE" font-size="12" font-weight="bold">MULTS</text>
    <text x="500" y="217" fill="#8D99AE" font-size="12" font-weight="bold">TEST MAE</text>
    <text x="610" y="217" fill="#8D99AE" font-size="12" font-weight="bold">TEST RMSE</text>
    <text x="710" y="217" fill="#8D99AE" font-size="12" font-weight="bold">REL ERR</text>
    
    <!-- Row 1: Persistence -->
    <rect x="80" y="235" width="720" height="38" rx="4" fill="#1E2D4A" fill-opacity="0.5"/>
    <text x="95" y="259" fill="#EF4444" font-size="13" font-weight="bold">Naive Persistence T(t)</text>
    <text x="320" y="259" fill="#8D99AE" font-size="13">0</text>
    <text x="410" y="259" fill="#8D99AE" font-size="13">0</text>
    <text x="500" y="259" fill="#EF4444" font-size="13" font-weight="bold">2.080°C</text>
    <text x="610" y="259" fill="#8D99AE" font-size="13">2.766°C</text>
    <text x="710" y="259" fill="#EF4444" font-size="13">100.0%</text>
    
    <!-- Row 2: Diurnal Anchor -->
    <rect x="80" y="278" width="720" height="38" rx="4" fill="#162238"/>
    <text x="95" y="302" fill="#FFFFFF" font-size="13">Diurnal Anchor T(t-21)</text>
    <text x="320" y="302" fill="#8D99AE" font-size="13">0</text>
    <text x="410" y="302" fill="#8D99AE" font-size="13">0</text>
    <text x="500" y="302" fill="#FFFFFF" font-size="13">0.832°C</text>
    <text x="610" y="302" fill="#8D99AE" font-size="13">1.156°C</text>
    <text x="710" y="302" fill="#8D99AE" font-size="13">40.0%</text>
    
    <!-- Row 3: Linear OLS (Target) -->
    <rect x="80" y="321" width="720" height="42" rx="4" fill="#48CAE4" fill-opacity="0.15" stroke="#48CAE4" stroke-width="1.5"/>
    <text x="95" y="347" fill="#48CAE4" font-size="14" font-weight="bold">Linear OLS (Target Hardware)</text>
    <text x="320" y="347" fill="#48CAE4" font-size="13" font-weight="bold">3</text>
    <text x="410" y="347" fill="#48CAE4" font-size="13" font-weight="bold">2</text>
    <text x="500" y="347" fill="#48CAE4" font-size="14" font-weight="bold">0.538°C</text>
    <text x="610" y="347" fill="#48CAE4" font-size="13" font-weight="bold">0.786°C</text>
    <text x="710" y="347" fill="#10B981" font-size="13" font-weight="bold">25.8%</text>
    
    <!-- Row 4: Ridge Regression -->
    <rect x="80" y="368" width="720" height="38" rx="4" fill="#162238"/>
    <text x="95" y="392" fill="#FFFFFF" font-size="13">Ridge Regression (6 features)</text>
    <text x="320" y="392" fill="#8D99AE" font-size="13">6</text>
    <text x="410" y="392" fill="#8D99AE" font-size="13">5</text>
    <text x="500" y="392" fill="#FFFFFF" font-size="13">0.509°C</text>
    <text x="610" y="392" fill="#8D99AE" font-size="13">0.736°C</text>
    <text x="710" y="392" fill="#8D99AE" font-size="13">24.5%</text>
    
    <!-- Row 5: Deep MLP -->
    <rect x="80" y="411" width="720" height="38" rx="4" fill="#1E2D4A" fill-opacity="0.5"/>
    <text x="95" y="435" fill="#F77F00" font-size="13">Deep MLP (12→16 ReLU→1)</text>
    <text x="320" y="435" fill="#8D99AE" font-size="13">225</text>
    <text x="410" y="435" fill="#F77F00" font-size="13" font-weight="bold">220</text>
    <text x="500" y="435" fill="#10B981" font-size="13">0.382°C</text>
    <text x="610" y="435" fill="#8D99AE" font-size="13">0.555°C</text>
    <text x="710" y="435" fill="#10B981" font-size="13">18.4%</text>
    
    <!-- Row 6: Gradient Boosted Trees -->
    <rect x="80" y="454" width="720" height="38" rx="4" fill="#162238"/>
    <text x="95" y="478" fill="#FFFFFF" font-size="13">GBDT (32 Shallow Trees)</text>
    <text x="320" y="478" fill="#8D99AE" font-size="13">256</text>
    <text x="410" y="478" fill="#8D99AE" font-size="13">N/A</text>
    <text x="500" y="478" fill="#FFFFFF" font-size="13">0.473°C</text>
    <text x="610" y="478" fill="#8D99AE" font-size="13">0.692°C</text>
    <text x="710" y="478" fill="#8D99AE" font-size="13">22.7%</text>
    
    <!-- Bottom note -->
    <rect x="80" y="505" width="720" height="110" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="530" fill="#48CAE4" font-size="12" font-weight="bold">CRITICAL ALGORITHMIC TAKEAWAYS:</text>
    <text x="100" y="552" fill="#FFFFFF" font-size="12">• Baseline Shift: Diurnal Anchor T(t-21) immediately captures 60% of baseline variance.</text>
    <text x="100" y="572" fill="#FFFFFF" font-size="12">• Linear OLS: Drops MAE to 0.538°C (74.1% error reduction) using just 2 multipliers!</text>
    <text x="100" y="595" fill="#F77F00" font-size="12">• Accuracy Ceiling: MLP achieves 0.382°C but requires 220 multipliers (110x hardware cost).</text>
  </g>
  <g id="card_analysis_06" data-pptx-bounds="845 135 375 500">
    <rect x="845" y="135" width="375" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="845" y="135" width="375" height="42" rx="10" fill="#1E2D4A"/>
    <text x="865" y="162" fill="#48CAE4" font-size="14" font-weight="bold">ERROR DROP &amp; CEILING</text>
    
    <rect x="865" y="195" width="335" height="120" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="880" y="222" fill="#8D99AE" font-size="11">PERSISTENCE TO OLS ERROR DROP</text>
    <text x="880" y="260" fill="#10B981" font-size="32" font-weight="bold">-74.1%</text>
    <text x="880" y="295" fill="#FFFFFF" font-size="12">MAE drops from 2.080°C → 0.538°C</text>
    
    <rect x="865" y="330" width="335" height="120" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="880" y="357" fill="#8D99AE" font-size="11">OLS ACCURACY VS. NEURAL CEILING</text>
    <text x="880" y="395" fill="#48CAE4" font-size="32" font-weight="bold">96.2%</text>
    <text x="880" y="430" fill="#FFFFFF" font-size="12">Practical parity with Deep MLP ceiling</text>
    
    <rect x="865" y="465" width="335" height="150" rx="8" fill="#F77F00" fill-opacity="0.1" stroke="#F77F00" stroke-width="1"/>
    <text x="880" y="492" fill="#F77F00" font-size="12" font-weight="bold">WHY STOP AT LINEAR OLS?</text>
    <text x="880" y="515" fill="#FFFFFF" font-size="12">• Extra gain of MLP is only 0.156°C.</text>
    <text x="880" y="535" fill="#8D99AE" font-size="12">• Sensor uncertainty in field IoT is ±0.2°C.</text>
    <text x="880" y="555" fill="#8D99AE" font-size="12">• Further algorithm complexity is swallowed</text>
    <text x="880" y="575" fill="#8D99AE" font-size="12">  by transducer analog thermal noise.</text>
    <text x="880" y="598" fill="#10B981" font-size="12" font-weight="bold">→ Linear OLS is the optimal engineering choice.</text>
  </g>
  <g id="ftr_06" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Benchmark Verdict: Linear OLS captures 74.1% of predictable variance with only 2 multiplications (MAE = 0.538°C)</text>
  </g>
</svg>
