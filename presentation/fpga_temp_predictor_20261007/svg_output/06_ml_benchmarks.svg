    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">ALGORITHMIC BENCHMARKS &amp; PARETO FRONTIER</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Model Comparison: Accuracy vs Silicon Footprint</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Held-out test dataset (17,520 hours) evaluating predictive accuracy against DSP demand</text>
  </g>
  <g id="tbl_benchmarks" data-pptx-bounds="60 135 760 500">
    <rect x="60" y="135" width="760" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="760" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">HELD-OUT TEST SET ACCURACY (17,520 SAMPLES)</text>
    
    <!-- Table Header Row -->
    <rect x="80" y="195" width="720" height="32" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">Architecture</text>
    <text x="270" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">MAE (°C)</text>
    <text x="380" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">RMSE (°C)</text>
    <text x="495" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">DSP Units</text>
    <text x="640" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">Latency</text>
    
    <!-- Row 1: Linear OLS (Selected) -->
    <rect x="80" y="235" width="720" height="46" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="95" y="264" fill="#1E3A8A" font-size="13" font-weight="bold">Linear OLS (Selected)</text>
    <text x="270" y="264" fill="#1E3A8A" font-size="13" font-weight="bold">0.538 °C</text>
    <text x="380" y="264" fill="#1E3A8A" font-size="13" font-weight="bold">0.786 °C</text>
    <text x="495" y="264" fill="#16A34A" font-size="13" font-weight="bold">1–2 Mults</text>
    <text x="640" y="264" fill="#16A34A" font-size="13" font-weight="bold">5–9 Clocks</text>
    
    <!-- Row 2: Ridge-6 Regression -->
    <rect x="80" y="289" width="720" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="316" fill="#0F172A" font-size="12">Ridge-6 (Multi-var)</text>
    <text x="270" y="316" fill="#0F172A" font-size="12">0.509 °C</text>
    <text x="380" y="316" fill="#0F172A" font-size="12">0.736 °C</text>
    <text x="495" y="316" fill="#334155" font-size="12">6 Mults</text>
    <text x="640" y="316" fill="#334155" font-size="12">14 Clocks</text>
    
    <!-- Row 3: Multilayer Perceptron -->
    <rect x="80" y="339" width="720" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="366" fill="#0F172A" font-size="12">MLP Neural Net (12-16-1)</text>
    <text x="270" y="366" fill="#0F172A" font-size="12">0.382 °C</text>
    <text x="380" y="366" fill="#0F172A" font-size="12">0.555 °C</text>
    <text x="495" y="366" fill="#D97706" font-size="12">32 Mults</text>
    <text x="640" y="366" fill="#D97706" font-size="12">48 Clocks</text>
    
    <!-- Row 4: Diurnal Baseline -->
    <rect x="80" y="389" width="720" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="416" fill="#64748B" font-size="12">Diurnal Base: T(t-21)</text>
    <text x="270" y="416" fill="#DC2626" font-size="12">0.832 °C</text>
    <text x="380" y="416" fill="#DC2626" font-size="12">1.187 °C</text>
    <text x="495" y="416" fill="#64748B" font-size="12">0 Mults</text>
    <text x="640" y="416" fill="#64748B" font-size="12">0 Clocks</text>
    
    <!-- Row 5: Persistence Baseline -->
    <rect x="80" y="439" width="720" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="466" fill="#64748B" font-size="12">Persistence: T(t)</text>
    <text x="270" y="466" fill="#DC2626" font-size="12">2.080 °C</text>
    <text x="380" y="466" fill="#DC2626" font-size="12">2.733 °C</text>
    <text x="495" y="466" fill="#64748B" font-size="12">0 Mults</text>
    <text x="640" y="466" fill="#64748B" font-size="12">0 Clocks</text>
    
    <!-- 3 Big Stat KPI Callout Badges -->
    <rect x="80" y="495" width="230" height="125" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="195" y="528" fill="#1E3A8A" font-size="24" font-weight="bold" text-anchor="middle">74.1%</text>
    <text x="195" y="552" fill="#2563EB" font-size="11" font-weight="bold" text-anchor="middle">ERROR REDUCTION</text>
    <text x="195" y="574" fill="#334155" font-size="10" text-anchor="middle">vs 2.080°C Persistence</text>
    <text x="195" y="594" fill="#1E3A8A" font-size="10" font-weight="bold" text-anchor="middle">35.3% over Diurnal Base</text>
    
    <rect x="325" y="495" width="230" height="125" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="440" y="528" fill="#1E3A8A" font-size="24" font-weight="bold" text-anchor="middle">0.156 °C</text>
    <text x="440" y="552" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">MARGINAL MLP GAP</text>
    <text x="440" y="574" fill="#334155" font-size="10" text-anchor="middle">MLP demands 32 DSPs</text>
    <text x="440" y="594" fill="#16A34A" font-size="10" font-weight="bold" text-anchor="middle">94% DSP Silicon Saved</text>
    
    <rect x="570" y="495" width="230" height="125" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
    <text x="685" y="528" fill="#16A34A" font-size="24" font-weight="bold" text-anchor="middle">11.6×</text>
    <text x="685" y="552" fill="#16A34A" font-size="11" font-weight="bold" text-anchor="middle">SILICON EFFICIENCY</text>
    <text x="685" y="574" fill="#334155" font-size="10" text-anchor="middle">Metric: 1 / (MAE × DSP)</text>
    <text x="685" y="594" fill="#16A34A" font-size="10" font-weight="bold" text-anchor="middle">OLS 0.93 vs MLP 0.08</text>
  </g>
  <g id="pareto_callout" data-pptx-bounds="840 135 380 500">
    <rect x="840" y="135" width="380" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="840" y="135" width="380" height="42" rx="8" fill="#F1F5F9"/>
    <text x="860" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">SILICON DSP ALLOCATION</text>
    
    <!-- Cyclone II Budget Card -->
    <rect x="860" y="195" width="340" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="875" y="222" fill="#1E3A8A" font-size="12" font-weight="bold">Cyclone II Multipliers (EP2C35)</text>
    <text x="875" y="246" fill="#334155" font-size="11">• Total Embedded DSP: 35 9×9 Multipliers</text>
    <text x="875" y="268" fill="#D97706" font-size="11" font-weight="bold">• MLP Demands 32 DSPs (91.4% capacity)</text>
    
    <!-- OLS Allocation Card -->
    <rect x="860" y="305" width="340" height="95" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="875" y="332" fill="#1E3A8A" font-size="12" font-weight="bold">Linear OLS Allocation Profile</text>
    <text x="875" y="356" fill="#1E3A8A" font-size="11">• Speed Core: 2 DSP units (5.7% budget)</text>
    <text x="875" y="378" fill="#16A34A" font-size="11" font-weight="bold">• Resource Core: 1 Shared DSP (2.8% budget)</text>
    
    <!-- Decision Card -->
    <rect x="860" y="415" width="340" height="205" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="875" y="445" fill="#16A34A" font-size="13" font-weight="bold">Pareto Optimal Decision:</text>
    <text x="875" y="475" fill="#0F172A" font-size="11.5">Linear OLS captures diurnal physics</text>
    <text x="875" y="495" fill="#0F172A" font-size="11.5">without exhausting on-chip multipliers.</text>
    <line x1="875" y1="515" x2="1185" y2="515" stroke="#16A34A" stroke-width="1"/>
    <text x="1030" y="555" fill="#16A34A" font-size="28" font-weight="bold" text-anchor="middle">11.6×</text>
    <text x="1030" y="580" fill="#1E3A8A" font-size="12" font-weight="bold" text-anchor="middle">Higher Accuracy-per-DSP vs MLP</text>
    <text x="1030" y="602" fill="#334155" font-size="10" text-anchor="middle">0 SRAM Blocks (Pure Shift Logic)</text>
  </g>
  <g id="ftr_06" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Linear OLS achieves 0.538°C MAE with 94% fewer multipliers than deep learning.</text>
