  <g id="card_superiority" data-pptx-bounds="60 405 565 230">
    <rect x="60" y="405" width="565" height="230" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <rect x="60" y="405" width="565" height="34" rx="8" fill="#F0FDF4"/>
    <text x="80" y="427" fill="#16A34A" font-size="12" font-weight="bold">ENGINEERING ADVANTAGES (KEY DIFFERENTIATORS)</text>
    
    <text x="80" y="460" fill="#1E3A8A" font-size="11" font-weight="bold">• 99.5% DSP Savings: <tspan fill="#334155" font-weight="normal">Uses 1–2 mults vs 473 in SBCCI '19.</tspan></text>
    <text x="80" y="500" fill="#1E3A8A" font-size="11" font-weight="bold">• II = 1 Streaming: <tspan fill="#334155" font-weight="normal">50 MSps @ 142.3 MHz F_max (0 bubble stalls).</tspan></text>
    <text x="80" y="540" fill="#1E3A8A" font-size="11" font-weight="bold">• Diurnal Anchor: <tspan fill="#334155" font-weight="normal">&gt;85% variance captured at zero logic cost.</tspan></text>
    <text x="80" y="580" fill="#1E3A8A" font-size="11" font-weight="bold">• DPI-C Verified: <tspan fill="#334155" font-weight="normal">100% bit-exact across 10,000+ vectors.</tspan></text>
  </g>
  <g id="card_inferiority" data-pptx-bounds="655 405 565 230">
    <rect x="655" y="405" width="565" height="230" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="655" y="405" width="565" height="34" rx="8" fill="#FFFBEB"/>
    <text x="675" y="427" fill="#D97706" font-size="12" font-weight="bold">ARCHITECTURAL BOUNDARIES &amp; DESIGN DECISIONS</text>
    
    <text x="675" y="460" fill="#1E3A8A" font-size="11" font-weight="bold">• Offline Partition: <tspan fill="#334155" font-weight="normal">Weights fitted in C++, reloadable via UART.</tspan></text>
    <text x="675" y="500" fill="#1E3A8A" font-size="11" font-weight="bold">• Bounded Range: <tspan fill="#334155" font-weight="normal">Q8.8 [-128°C, +128°C] tailored for sensors.</tspan></text>
    <text x="675" y="540" fill="#1E3A8A" font-size="11" font-weight="bold">• 3-Tap Scope: <tspan fill="#334155" font-weight="normal">Local edge predictor vs generic matrix solver.</tspan></text>
    <text x="675" y="580" fill="#1E3A8A" font-size="11" font-weight="bold">• Target Silicon: <tspan fill="#334155" font-weight="normal">90nm Cyclone II; portable to modern ASIC.</tspan></text>
  </g>
