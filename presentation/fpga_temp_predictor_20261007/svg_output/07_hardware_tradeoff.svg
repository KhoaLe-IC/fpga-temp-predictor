<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_07" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">HARDWARE-ALGORITHM CO-DESIGN</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">The Silicon Budget Reality: Why Linear OLS on Cyclone II?</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Rigorous diminishing returns analysis against Altera Cyclone II EP2C35 physical multiplier constraints</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="card_diminishing_returns" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">DIMINISHING RETURNS: ERROR DROP PER MULTIPLIER</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Step 1: Persistence → Linear OLS</text>
    <rect x="80" y="225" width="525" height="65" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="95" y="250" fill="#10B981" font-size="13" font-weight="bold">MAE Improvement: 1.542°C drop | Hardware Cost: 2 Multipliers</text>
    <text x="95" y="272" fill="#48CAE4" font-size="14" font-weight="bold">Efficiency Metric: 0.7710°C error drop per multiplier block!</text>
    
    <text x="80" y="320" fill="#FFFFFF" font-size="15" font-weight="bold">Step 2: Linear OLS → Deep MLP</text>
    <rect x="80" y="335" width="525" height="65" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="95" y="360" fill="#F77F00" font-size="13" font-weight="bold">MAE Improvement: 0.156°C drop | Hardware Cost: 218 Additional Multipliers</text>
    <text x="95" y="382" fill="#EF4444" font-size="14" font-weight="bold">Efficiency Metric: 0.0007°C error drop per multiplier block!</text>
    
    <rect x="80" y="420" width="525" height="195" rx="8" fill="#1E2D4A" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="448" fill="#F77F00" font-size="14" font-weight="bold">EFFICIENCY COLLAPSE RATIO:</text>
    <text x="100" y="490" fill="#EF4444" font-size="36" font-weight="bold">1,100× EFFICIENCY DROP</text>
    <text x="100" y="525" fill="#FFFFFF" font-size="13">• Each multiplier in the OLS design is 1,100x more impactful</text>
    <text x="100" y="545" fill="#FFFFFF" font-size="13">  in reducing error than multipliers inside an MLP.</text>
    <text x="100" y="570" fill="#8D99AE" font-size="12">• Spending silicon for an MLP represents gross over-engineering</text>
    <text x="100" y="590" fill="#8D99AE" font-size="12">  with zero practical benefit in meteorological forecasting.</text>
  </g>
  <g id="card_cyclone_budget" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="675" y="162" fill="#48CAE4" font-size="14" font-weight="bold">ALTERA CYCLONE II (EP2C35) MULTIPLIER REALITY</text>
    
    <text x="675" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Total Chip Multiplier Budget: 35 Blocks</text>
    <text x="675" y="235" fill="#8D99AE" font-size="13">• Cyclone II EP2C35 contains exactly 35 embedded 18x18 multipliers.</text>
    
    <rect x="675" y="255" width="525" height="150" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="695" y="280" fill="#EF4444" font-size="13" font-weight="bold">PARALLEL MLP ON DE2: PHYSICALLY IMPOSSIBLE!</text>
    <text x="695" y="305" fill="#FFFFFF" font-size="12">• Fully parallel MLP requires 220 multipliers.</text>
    <text x="695" y="325" fill="#EF4444" font-size="14" font-weight="bold">  220 / 35 = 628% of entire chip multiplier resource!</text>
    <text x="695" y="350" fill="#8D99AE" font-size="12">• Time-multiplexed MLP requires complex multi-bank BRAM scheduling,</text>
    <text x="695" y="370" fill="#8D99AE" font-size="12">  non-linear activation LUTs, and hundreds of FSM cycles.</text>
    <text x="695" y="390" fill="#8D99AE" font-size="12">• Massive development cost and routing congestion.</text>
    
    <rect x="675" y="420" width="525" height="195" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1"/>
    <text x="695" y="448" fill="#10B981" font-size="14" font-weight="bold">THE LINEAR OLS ARCHITECTURAL VERDICT:</text>
    <text x="695" y="480" fill="#FFFFFF" font-size="13">• Speed Core: Uses exactly </text>
    <text x="860" y="480" fill="#48CAE4" font-size="14" font-weight="bold">2 Multipliers (5.7% of chip)</text>
    <text x="695" y="505" fill="#FFFFFF" font-size="13">• Resource Core: Uses exactly </text>
    <text x="880" y="505" fill="#10B981" font-size="14" font-weight="bold">1 Multiplier (2.8% of chip)</text>
    <text x="695" y="535" fill="#8D99AE" font-size="12">• Leaves >94% of DSP resources free for user applications, UART,</text>
    <text x="695" y="555" fill="#8D99AE" font-size="12">  and signal conditioning filters.</text>
    <text x="695" y="585" fill="#10B981" font-size="13" font-weight="bold">→ Achieves 96% of neural accuracy while consuming &lt;1% FPGA logic.</text>
  </g>
  <g id="ftr_07" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Silicon Constraint: Cyclone II has 35 multipliers; parallel MLP requires 220 (628%); OLS uses only 1 to 2 multipliers</text>
  </g>
</svg>
