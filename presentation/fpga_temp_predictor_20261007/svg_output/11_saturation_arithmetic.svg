<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_11" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">DYNAMIC RANGE INTEGRITY</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Saturation Arithmetic: Sat16 Transfer Function</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Preventing destructive two's complement sign-inversion wrap-around via signed 16-bit hardware clamping</text>
  </g>
  <g id="sat_curve_graph" data-pptx-bounds="60 135 600 500">
    <rect x="60" y="135" width="600" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="600" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">SAT16 TRANSFER FUNCTION: RESULT_OUT VS SHIFTED_ACCUM</text>
    
    <!-- Graph Canvas Box -->
    <rect x="80" y="195" width="560" height="295" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Axes: X-Axis at y=345, Y-Axis at x=360 -->
    <line x1="110" y1="345" x2="610" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="575" y="362" fill="#64748B" font-size="10">Shifted Accum</text>
    
    <line x1="360" y1="210" x2="360" y2="475" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="365" y="222" fill="#64748B" font-size="10">Output Q8.8</text>
    
    <!-- Grid Reference Lines -->
    <line x1="110" y1="250" x2="610" y2="250" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="260" y="246" fill="#D97706" font-size="10" font-weight="bold">+127.996°C (16'sh7FFF)</text>
    
    <line x1="110" y1="440" x2="610" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="260" y="455" fill="#D97706" font-size="10" font-weight="bold">-128.000°C (16'sh8000)</text>
    
    <!-- Vertical Knee lines: x=210 (-32768), x=510 (+32767) -->
    <line x1="210" y1="210" x2="210" y2="475" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="175" y="488" fill="#64748B" font-size="9">-32768</text>
    
    <line x1="510" y1="210" x2="510" y2="475" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="495" y="488" fill="#64748B" font-size="9">+32767</text>
    
    <!-- The Transfer Function Polyline -->
    <line x1="110" y1="440" x2="210" y2="440" stroke="#D97706" stroke-width="3"/>
    <line x1="210" y1="440" x2="510" y2="250" stroke="#2563EB" stroke-width="3"/>
    <line x1="510" y1="250" x2="610" y2="250" stroke="#D97706" stroke-width="3"/>
    
    <!-- Knee Points -->
    <circle cx="210" cy="440" r="5" fill="#D97706"/>
    <circle cx="510" cy="250" r="5" fill="#D97706"/>
    <circle cx="360" cy="345" r="4" fill="#1E3A8A"/>
    <text x="370" y="340" fill="#1E3A8A" font-size="9" font-weight="bold">(0, 0)</text>
    
    <!-- Region Annotations -->
    <rect x="120" y="390" width="85" height="34" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
    <text x="162" y="405" fill="#D97706" font-size="9" font-weight="bold" text-anchor="middle">MIN CLAMP</text>
    <text x="162" y="418" fill="#D97706" font-size="9" text-anchor="middle">16'sh8000</text>
    
    <rect x="315" y="275" width="95" height="34" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="362" y="290" fill="#1E3A8A" font-size="9" font-weight="bold" text-anchor="middle">LINEAR PASS</text>
    <text x="362" y="303" fill="#2563EB" font-size="9" text-anchor="middle">y = accum[15:0]</text>
    
    <rect x="515" y="270" width="85" height="34" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
    <text x="557" y="285" fill="#D97706" font-size="9" font-weight="bold" text-anchor="middle">MAX CLAMP</text>
    <text x="557" y="298" fill="#D97706" font-size="9" text-anchor="middle">16'sh7FFF</text>
    
    <!-- Bottom Explanation -->
    <rect x="80" y="505" width="560" height="110" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="528" fill="#1E3A8A" font-size="11" font-weight="bold">Why Saturation is Mandatory in Two's Complement:</text>
    <text x="95" y="550" fill="#334155" font-size="11">• Unclamped wrap: +128.01°C flips to -127.99°C sign overflow</text>
    <text x="95" y="572" fill="#334155" font-size="11">• Actuator risk: Sign flip triggers false heating alarms</text>
    <text x="95" y="595" fill="#16A34A" font-size="11" font-weight="bold">• Sat16 clamp: Bounds extreme spikes to max signed rails</text>
  </g>
  <g id="sat_rtl_code" data-pptx-bounds="680 135 540 500">
    <rect x="680" y="135" width="540" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="680" y="135" width="540" height="42" rx="8" fill="#F1F5F9"/>
    <text x="700" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">SYNTHESIZABLE VERILOG SATURATION LOGIC</text>
    
    <text x="700" y="205" fill="#0F172A" font-size="13" font-weight="bold">Production RTL Implementation (Speed &amp; Resource):</text>
    
    <rect x="700" y="222" width="500" height="230" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="715" y="244" fill="#64748B" font-size="11">// Arithmetic shift by 14 fractional bits</text>
    <text x="715" y="264" fill="#1E3A8A" font-size="11" font-weight="bold">wire signed [34:0] s4_sh = s4_s &gt;&gt;&gt; 14;</text>
    <text x="715" y="290" fill="#64748B" font-size="11">// Sat16 signed 16-bit saturation</text>
    <text x="715" y="310" fill="#0F172A" font-size="11">always @(posedge clk) begin</text>
    <text x="735" y="330" fill="#D97706" font-size="11" font-weight="bold">    if (s4_sh &gt; 35'sd32767)</text>
    <text x="755" y="348" fill="#0F172A" font-size="11">        s5_out &lt;= 16'sh7FFF;  // +127.996 °C clamp</text>
    <text x="735" y="368" fill="#D97706" font-size="11" font-weight="bold">    else if (s4_sh &lt; -35'sd32768)</text>
    <text x="755" y="386" fill="#0F172A" font-size="11">        s5_out &lt;= 16'sh8000;  // -128.000 °C clamp</text>
    <text x="735" y="406" fill="#2563EB" font-size="11" font-weight="bold">    else</text>
    <text x="755" y="424" fill="#0F172A" font-size="11">        s5_out &lt;= s4_sh[15:0]; // Normal pass</text>
    <text x="715" y="442" fill="#0F172A" font-size="11">end</text>
    
    <rect x="700" y="468" width="500" height="147" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
    <text x="715" y="495" fill="#16A34A" font-size="12" font-weight="bold">DPI-C Golden Model Verification Contract:</text>
    <text x="715" y="520" fill="#0F172A" font-size="11">• C++ oracle executes identical signed check (ols_reference.hpp):</text>
    <text x="730" y="542" fill="#1E3A8A" font-size="11" font-weight="bold">q &gt; 32767 ? 32767 : q &lt; -32768 ? -32768 : int(q);</text>
    <text x="715" y="568" fill="#0F172A" font-size="11">• Stress tests inject extreme inputs (-50°C and +120°C swings).</text>
    <text x="715" y="595" fill="#16A34A" font-size="11" font-weight="bold">Zero mismatches: 100% bit-exact across all saturation corners!</text>
  </g>
  <g id="ftr_11" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Hardware sat16 saturation eliminates destructive sign-inversion wrap-around across extreme inputs.</text>
  </g>
</svg>
