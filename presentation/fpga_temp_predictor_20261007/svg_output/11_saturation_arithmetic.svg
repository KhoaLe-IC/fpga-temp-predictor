<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_11" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">OUTPUT SATURATION ARITHMETIC</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Output Saturation Arithmetic (sat16) &amp; Hazard Prevention</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Preventing catastrophic register wrap-around under extreme thermal transients or uninitialized data</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="card_wrap_hazard" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#F77F00" font-size="14" font-weight="bold">THE REGISTER WRAP-AROUND HAZARD</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">The Post-Shift Bit Width:</text>
    <text x="80" y="235" fill="#8D99AE" font-size="13">• After arithmetic right shift by 14, scaled has 21 bits signed (Q13.8).</text>
    <text x="80" y="255" fill="#8D99AE" font-size="13">• The output register forecast_out is 16 bits signed (Q8.8).</text>
    <text x="80" y="275" fill="#F77F00" font-size="13" font-weight="bold">• 5 upper bits [20:16] contain dynamic overflow headroom.</text>
    
    <rect x="80" y="300" width="525" height="150" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1"/>
    <text x="100" y="325" fill="#EF4444" font-size="13" font-weight="bold">THE CATASTROPHIC WRAP-AROUND ANOMALY:</text>
    <text x="100" y="348" fill="#FFFFFF" font-size="12">If scaled exceeds 16-bit signed boundary [+32767, -32768]:</text>
    <text x="100" y="372" fill="#F77F00" font-size="13">• +32,768 (represents +128.00°C) truncates to: </text>
    <text x="440" y="372" fill="#EF4444" font-size="14" font-weight="bold">-32,768 (-128.00°C)!</text>
    <text x="100" y="400" fill="#8D99AE" font-size="12">• A severe afternoon heatwave (+45°C) would erroneously wrap around</text>
    <text x="100" y="420" fill="#8D99AE" font-size="12">  to severe sub-zero freezing (-83°C)!</text>
    <text x="100" y="440" fill="#EF4444" font-size="12" font-weight="bold">→ Disastrous for IoT agricultural greenhouse or HVAC actuators.</text>
    
    <rect x="80" y="465" width="525" height="150" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="490" fill="#48CAE4" font-size="13" font-weight="bold">DESIGN VERIFICATION COVERAGE GOAL:</text>
    <text x="100" y="515" fill="#FFFFFF" font-size="12">• Testbench must explicitly inject boundary corner vectors</text>
    <text x="100" y="535" fill="#FFFFFF" font-size="12">  exceeding +127°C and falling below -128°C.</text>
    <text x="100" y="560" fill="#8D99AE" font-size="12">• Monitored via dedicated sat_hi and sat_lo hardware event counters.</text>
    <text x="100" y="590" fill="#10B981" font-size="12" font-weight="bold">→ Proves 100% saturation clamp branch coverage.</text>
  </g>
  <g id="card_sat_logic" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="675" y="162" fill="#10B981" font-size="14" font-weight="bold">HARDWARE SATURATION UNIT ARCHITECTURE (sat16.v)</text>
    
    <text x="675" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Clamping Transfer Function:</text>
    
    <rect x="675" y="230" width="525" height="150" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="695" y="258" fill="#48CAE4" font-size="12" font-family="Consolas, monospace">if (scaled &gt; 21&apos;sd32767) begin</text>
    <text x="715" y="280" fill="#10B981" font-size="12" font-family="Consolas, monospace">    forecast_out = 16&apos;sh7FFF;  // Clamp to +127.996°C</text>
    <text x="695" y="302" fill="#48CAE4" font-size="12" font-family="Consolas, monospace">end else if (scaled &lt; -21&apos;sd32768) begin</text>
    <text x="715" y="324" fill="#F77F00" font-size="12" font-family="Consolas, monospace">    forecast_out = 16&apos;sh8000;  // Clamp to -128.000°C</text>
    <text x="695" y="346" fill="#48CAE4" font-size="12" font-family="Consolas, monospace">end else begin</text>
    <text x="715" y="368" fill="#FFFFFF" font-size="12" font-family="Consolas, monospace">    forecast_out = scaled[15:0]; // Linear pass-through</text>
    
    <rect x="675" y="395" width="525" height="220" rx="8" fill="#1E2D4A" stroke="#2A3D66" stroke-width="1"/>
    <text x="695" y="420" fill="#48CAE4" font-size="13" font-weight="bold">SAFETY &amp; CONTROL BENEFITS:</text>
    <text x="695" y="450" fill="#FFFFFF" font-size="13">• Monotonic Bounded Guarantee:</text>
    <text x="695" y="472" fill="#8D99AE" font-size="12">  Higher true inputs always produce equal or higher predictions.</text>
    <text x="695" y="492" fill="#8D99AE" font-size="12">  Never flips polarity or injects negative gain into downstream control loops.</text>
    
    <text x="695" y="525" fill="#FFFFFF" font-size="13">• Lightweight Hardware Implementation:</text>
    <text x="695" y="547" fill="#8D99AE" font-size="12">  Synthesizes to just 21 comparator cells and one 16-bit MUX.</text>
    <text x="695" y="567" fill="#8D99AE" font-size="12">  Less than 18 Logic Elements on Cyclone II FPGA.</text>
    <text x="695" y="595" fill="#10B981" font-size="12" font-weight="bold">→ Industrial robustness standard for mission-critical edge silicon.</text>
  </g>
  <g id="ftr_11" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Saturation Arithmetic: Clamps out-of-range values to [0x8000, 0x7FFF], preventing catastrophic sign inversion</text>
  </g>
</svg>
