<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_10" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">DV PRECISION ALIGNMENT</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Hardware Floor-Scaling: Resolving C++ vs. Verilog Divergence</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">How arithmetic right shift in hardware differs from C++ division and the bit-exact golden fix</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="card_scale_reduction" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">SCALE REDUCTION MECHANISM IN VERILOG RTL</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">The Scale Reduction Objective:</text>
    <text x="80" y="235" fill="#8D99AE" font-size="13">• Accumulator operates in Q13.22 (2^22 fractional domain).</text>
    <text x="80" y="255" fill="#8D99AE" font-size="13">• Output forecast_out requires Q8.8 (2^8 fractional domain).</text>
    <text x="80" y="275" fill="#48CAE4" font-size="14" font-weight="bold">• Must divide by 2^(22 - 8) = 2^14 = 16,384.</text>
    
    <text x="80" y="315" fill="#FFFFFF" font-size="15" font-weight="bold">Hardware RTL Implementation:</text>
    <rect x="80" y="330" width="525" height="60" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="95" y="355" fill="#48CAE4" font-size="13" font-weight="bold">wire signed [20:0] scaled = accum &gt;&gt;&gt; 14;</text>
    <text x="95" y="375" fill="#8D99AE" font-size="11">Verilog arithmetic right shift preserves sign bit while dropping lower 14 bits.</text>
    
    <rect x="80" y="410" width="525" height="205" rx="8" fill="#1E2D4A" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="438" fill="#10B981" font-size="13" font-weight="bold">SILICON COST OF HARDWARE FLOOR-SCALING:</text>
    <text x="100" y="475" fill="#10B981" font-size="32" font-weight="bold">EXACTLY 0 LOGIC GATES!</text>
    <text x="100" y="510" fill="#FFFFFF" font-size="13">• In FPGA silicon, shift by a fixed power of 2 is free.</text>
    <text x="100" y="530" fill="#8D99AE" font-size="12">• It is implemented as pure wire slicing: wire [20:0] scaled = accum[34:14].</text>
    <text x="100" y="550" fill="#8D99AE" font-size="12">• Zero LUTs, zero flip-flops, zero propagation delay, zero power.</text>
    <text x="100" y="580" fill="#48CAE4" font-size="12" font-weight="bold">→ Massive architectural advantage of power-of-two Q-formats!</text>
  </g>
  <g id="card_cpp_trap" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="675" y="162" fill="#F77F00" font-size="14" font-weight="bold">THE ASYMMETRIC TRUNCATION PITFALL &amp; DV FIX</text>
    
    <text x="675" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">The Divergence on Negative Temperatures:</text>
    <text x="675" y="235" fill="#8D99AE" font-size="13">• Standard C++ `/ 16384` performs Truncation (rounds toward ZERO).</text>
    <text x="675" y="255" fill="#8D99AE" font-size="13">• Verilog `&gt;&gt;&gt; 14` performs Floor Division (rounds toward -INFINITY).</text>
    
    <rect x="675" y="275" width="525" height="110" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1"/>
    <text x="695" y="300" fill="#EF4444" font-size="13" font-weight="bold">CONCRETE NEGATIVE NUMBER COUNTEREXAMPLE:</text>
    <text x="695" y="322" fill="#FFFFFF" font-size="12">Let accum = -2560 (represents -10.0°C in intermediate fractional state):</text>
    <text x="695" y="345" fill="#F77F00" font-size="13">C++: -2560 / 16384 = </text>
    <text x="850" y="345" fill="#EF4444" font-size="14" font-weight="bold">0</text>
    <text x="695" y="368" fill="#48CAE4" font-size="13">Verilog: -2560 &gt;&gt;&gt; 14 = </text>
    <text x="860" y="368" fill="#10B981" font-size="14" font-weight="bold">-1  (FATAL 1-LSB MISMATCH!)</text>
    
    <rect x="675" y="400" width="525" height="215" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1"/>
    <text x="695" y="425" fill="#10B981" font-size="13" font-weight="bold">THE GOLDEN C++ REFERENCE MODEL SOLUTION:</text>
    <text x="695" y="450" fill="#FFFFFF" font-size="12">Custom Floor-Scaling Function (dpi/ols_reference.hpp):</text>
    <rect x="695" y="465" width="485" height="55" rx="4" fill="#0B132B"/>
    <text x="710" y="488" fill="#48CAE4" font-size="11" font-family="Consolas, monospace">inline int64_t floor_scale(int64_t s) &#123;</text>
    <text x="710" y="506" fill="#48CAE4" font-size="11" font-family="Consolas, monospace">    return s / 16384 - ((s &lt; 0 &amp;&amp; s % 16384 != 0) ? 1 : 0);</text>
    <text x="710" y="524" fill="#48CAE4" font-size="11" font-family="Consolas, monospace">&#125;</text>
    <text x="695" y="545" fill="#FFFFFF" font-size="12">• Subtracts 1 if negative and remainder != 0.</text>
    <text x="695" y="565" fill="#8D99AE" font-size="11">• Perfectly emulates Verilog hardware arithmetic right shift.</text>
    <text x="695" y="590" fill="#10B981" font-size="12" font-weight="bold">→ Result: 100% bit-exact equivalence on all positive &amp; negative values!</text>
  </g>
  <g id="ftr_10" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">DV Crucial Insight: C++ integer division rounds toward zero; Verilog >>> rounds toward -infinity; fixed via floor_scale()</text>
  </g>
</svg>
