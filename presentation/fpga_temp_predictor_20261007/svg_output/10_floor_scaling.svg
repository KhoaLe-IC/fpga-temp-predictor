<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_10" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">ROUNDING ARCHITECTURE &amp; NOISE BOUND</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Truncation Analysis: Floor Scaling vs Silicon Cost</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Bounded truncation error and silicon cost vs rounding alternatives</text>
  </g>
  <g id="box_trunc_proof" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">ARITHMETIC RIGHT SHIFT (FLOOR SCALING)</text>
    
    <text x="80" y="205" fill="#0F172A" font-size="13" font-weight="bold">Hardware Implementation (0 Logic Elements):</text>
    <rect x="80" y="220" width="525" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="246" fill="#1E3A8A" font-size="12" font-weight="bold">wire signed [34:0] s4_sh = s4_s &gt;&gt;&gt; 14;  // Pure wire routing</text>
    
    <text x="80" y="290" fill="#0F172A" font-size="13" font-weight="bold">Mathematical Error Bound Proof:</text>
    <text x="80" y="315" fill="#334155" font-size="12">• Truncation Inequality:</text>
    <text x="100" y="342" fill="#2563EB" font-size="13" font-weight="bold">(x / 2^14) - 1  &lt;  floor(x / 2^14)  &lt;=  (x / 2^14)</text>
    <text x="80" y="375" fill="#334155" font-size="12">• Max Truncation Error in Temperature Domain:</text>
    <text x="100" y="402" fill="#16A34A" font-size="14" font-weight="bold">|ε_trunc| &lt; 2^-8 °C = 0.003906 °C</text>
    
    <rect x="80" y="435" width="525" height="175" rx="6" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="465" fill="#1E3A8A" font-size="13" font-weight="bold">Sensor Noise Floor Comparison:</text>
    <text x="95" y="495" fill="#0F172A" font-size="12">• Hardware Thermistor Noise:  ±0.1000 °C</text>
    <text x="95" y="522" fill="#0F172A" font-size="12">• Max Truncation Error:  &lt; 0.0039 °C (25.6x smaller)</text>
    <line x1="95" y1="542" x2="585" y2="542" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="95" y="570" fill="#1E3A8A" font-size="12" font-weight="bold">Noise Floor Masks Truncation Completely</text>
    <text x="95" y="592" fill="#16A34A" font-size="11" font-weight="bold">Rounding adders add silicon cost with zero observable gain.</text>
  </g>
  <g id="box_rounding_tradeoff" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="8" fill="#F1F5F9"/>
    <text x="675" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">HARDWARE COST OF ROUNDING MODES</text>
    
    <text x="675" y="205" fill="#0F172A" font-size="13" font-weight="bold">Synthesis Comparison (Cyclone II EP2C35):</text>
    
    <!-- Mode 1: Truncation -->
    <rect x="675" y="222" width="525" height="52" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
    <text x="690" y="244" fill="#16A34A" font-size="12" font-weight="bold">1. Floor Truncation (Selected in RTL)</text>
    <text x="690" y="262" fill="#334155" font-size="11">0 LEs | 0 Latency | Bias: -0.002°C (masked by sensor)</text>
    
    <!-- Mode 2: Round-to-Nearest -->
    <rect x="675" y="282" width="525" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="690" y="304" fill="#0F172A" font-size="12" font-weight="bold">2. Round-to-Nearest (+0.5 LSB Adder)</text>
    <text x="690" y="322" fill="#334155" font-size="11">+35 LEs (35-bit adder) | +1 Cycle | Bias: ~0.000°C</text>
    
    <!-- Mode 3: Convergent Rounding -->
    <rect x="675" y="342" width="525" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="690" y="364" fill="#0F172A" font-size="12" font-weight="bold">3. Convergent Round-to-Even</text>
    <text x="690" y="382" fill="#334155" font-size="11">+48 LEs (adder + tie logic) | +1 Cycle | Bias: 0.000°C</text>
    
    <!-- Rationale Box -->
    <rect x="675" y="410" width="525" height="200" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="690" y="438" fill="#1E3A8A" font-size="12" font-weight="bold">Silicon Optimization Impact:</text>
    <text x="690" y="465" fill="#0F172A" font-size="11">• Silicon: Saves 14.8% of Resource Core logic (no adder)</text>
    <text x="690" y="490" fill="#0F172A" font-size="11">• Timing: Saves 2.2 ns critical path (+15% slack)</text>
    <text x="690" y="515" fill="#1E3A8A" font-size="11" font-weight="bold">• DPI-C C++ Oracle Formula (ols_reference.hpp):</text>
    <rect x="690" y="530" width="495" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="705" y="551" fill="#1E3A8A" font-size="11" font-weight="bold">s / 16384 - ((s &lt; 0 &amp;&amp; s % 16384 != 0) ? 1 : 0);</text>
    <text x="690" y="590" fill="#16A34A" font-size="11" font-weight="bold">Bit-exact match verified across 10,000+ test vectors.</text>
  </g>
  <g id="ftr_10" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Floor truncation costs 0 LEs with error bounded under 0.0039°C, saving 14.8% silicon area without forecast penalty.</text>
  </g>
</svg>
