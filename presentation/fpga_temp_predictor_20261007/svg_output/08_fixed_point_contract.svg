<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_08" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">FIXED-POINT QUANTIZATION ARCHITECTURE</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Precision Contract: Signed Q8.8 &amp; Q2.14 Bitfields</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Eliminating floating-point silicon overhead via two's complement integer arithmetic</text>
  </g>
  <g id="bitfield_visual" data-pptx-bounds="60 135 760 500">
    <rect x="60" y="135" width="760" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="760" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">REGISTER BITFIELD STRUCTURE</text>
    
    <!-- Register 1: Temperature Q8.8 Format -->
    <text x="80" y="205" fill="#0F172A" font-size="13" font-weight="bold">1. Temperature Telemetry: Signed Q8.8 (16 Bits)</text>
    
    <text x="95" y="228" fill="#64748B" font-size="10">Bit 15</text>
    <text x="140" y="228" fill="#64748B" font-size="10">14</text>
    <text x="375" y="228" fill="#64748B" font-size="10">8</text>
    <text x="440" y="228" fill="#64748B" font-size="10">7</text>
    <text x="735" y="228" fill="#64748B" font-size="10">0</text>
    
    <!-- Bitfield Bar Q8.8 -->
    <rect x="80" y="238" width="45" height="42" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="102" y="264" fill="#D97706" font-size="12" font-weight="bold" text-anchor="middle">S</text>
    
    <rect x="125" y="238" width="285" height="42" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="267" y="264" fill="#1E3A8A" font-size="12" font-weight="bold" text-anchor="middle">Integer: 7 Bits [14:8]</text>
    
    <line x1="410" y1="233" x2="410" y2="285" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="3 2"/>
    <text x="410" y="300" fill="#DC2626" font-size="10" font-weight="bold" text-anchor="middle">Radix Point</text>
    
    <rect x="410" y="238" width="350" height="42" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
    <text x="585" y="264" fill="#2563EB" font-size="12" font-weight="bold" text-anchor="middle">Fractional: 8 Bits [7:0]</text>
    
    <text x="80" y="328" fill="#334155" font-size="11">• Range: [-128.000 °C, +127.996 °C] | LSB = 2^-8 = 0.0039 °C (25.6x below sensor noise)</text>
    
    <!-- Register 2: Coefficients Q2.14 Format -->
    <text x="80" y="375" fill="#0F172A" font-size="13" font-weight="bold">2. Model Weights: Signed Q2.14 (16 Bits)</text>
    
    <text x="95" y="398" fill="#64748B" font-size="10">Bit 15</text>
    <text x="140" y="398" fill="#64748B" font-size="10">14</text>
    <text x="180" y="398" fill="#64748B" font-size="10">13</text>
    <text x="735" y="398" fill="#64748B" font-size="10">0</text>
    
    <!-- Bitfield Bar Q2.14 -->
    <rect x="80" y="408" width="45" height="42" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="102" y="434" fill="#D97706" font-size="12" font-weight="bold" text-anchor="middle">S</text>
    
    <rect x="125" y="408" width="45" height="42" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="147" y="434" fill="#1E3A8A" font-size="11" font-weight="bold" text-anchor="middle">I0</text>
    
    <line x1="170" y1="403" x2="170" y2="455" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="3 2"/>
    <text x="170" y="470" fill="#DC2626" font-size="10" font-weight="bold" text-anchor="middle">Radix Point</text>
    
    <rect x="170" y="408" width="590" height="42" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="465" y="434" fill="#4F46E5" font-size="12" font-weight="bold" text-anchor="middle">Fractional: 14 Bits [13:0]</text>
    
    <text x="80" y="498" fill="#334155" font-size="11">• Range: [-2.0000, +1.9999] | Resolution LSB = 2^-14 = 0.000061</text>
    
    <!-- Verilog Parameter Box -->
    <rect x="80" y="525" width="680" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="550" fill="#1E3A8A" font-size="11" font-weight="bold">Hardware Quantized Weight Constants (Verilog / DPI-C):</text>
    <text x="95" y="572" fill="#0F172A" font-size="11">COEF_A = 16'sh2FB6; // a = 0.7455 × 16384 = 12214 (Q2.14)</text>
    <text x="95" y="594" fill="#0F172A" font-size="11">COEF_B = 16'sh0096; // b = 0.0091 × 16384 = 150 (Q2.14)  |  COEF_C = 16'sh0000; (Q8.8)</text>
  </g>
  <g id="quant_table" data-pptx-bounds="840 135 380 500">
    <rect x="840" y="135" width="380" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="840" y="135" width="380" height="42" rx="8" fill="#F1F5F9"/>
    <text x="860" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">FORMAT SPECIFICATION</text>
    
    <text x="860" y="205" fill="#0F172A" font-size="13" font-weight="bold">Signal Mapping:</text>
    
    <rect x="860" y="220" width="340" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="875" y="239" fill="#1E3A8A" font-size="11" font-weight="bold">T(t), T(t-24), T(t-21), T(t-3):</text>
    <text x="875" y="255" fill="#334155" font-size="10.5">Signed Q8.8 (16b) | Radix at bit 8</text>
    
    <rect x="860" y="270" width="340" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="875" y="289" fill="#1E3A8A" font-size="11" font-weight="bold">Coefficients a, b:</text>
    <text x="875" y="305" fill="#334155" font-size="10.5">Signed Q2.14 (16b) | Radix at bit 14</text>
    
    <rect x="860" y="320" width="340" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="875" y="339" fill="#1E3A8A" font-size="11" font-weight="bold">Multipliers P1, P2:</text>
    <text x="875" y="355" fill="#334155" font-size="10.5">Signed Q11.22 (33b) | Radix at bit 22</text>
    
    <rect x="860" y="370" width="340" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="875" y="389" fill="#1E3A8A" font-size="11" font-weight="bold">Accumulator Bus:</text>
    <text x="875" y="405" fill="#334155" font-size="10.5">Signed Q13.22 (35b) | Shifted to Q13.8</text>
    
    <rect x="860" y="425" width="340" height="190" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
    <text x="875" y="452" fill="#16A34A" font-size="12" font-weight="bold">Quantization Loss Audit:</text>
    <text x="875" y="478" fill="#0F172A" font-size="11.5">• Floating-Point MAE:  0.5378 °C</text>
    <text x="875" y="502" fill="#0F172A" font-size="11.5">• Fixed-Point Q8.8 MAE:  0.5381 °C</text>
    <text x="875" y="526" fill="#0F172A" font-size="11.5">• Precision Loss:  0.0003 °C (0.05% relative)</text>
    <line x1="875" y1="544" x2="1185" y2="544" stroke="#16A34A" stroke-width="0.8"/>
    <text x="875" y="570" fill="#16A34A" font-size="11" font-weight="bold">Negligible Precision Loss</text>
    <text x="875" y="592" fill="#334155" font-size="10">Masked by physical sensor noise floor.</text>
  </g>
  <g id="ftr_08" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Strict Q8.8 and Q2.14 precision contracts eliminate floating-point logic while incurring only 0.0003°C error.</text>
  </g>
</svg>
