  </g>
  <g id="card_validation_stats" data-pptx-bounds="60 135 565 500">
    <rect x="60" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">17,520-HOUR CONTINUOUS STREAMING VALIDATION</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Held-Out Test Set Execution Profile:</text>
    <text x="80" y="235" fill="#8D99AE" font-size="13">• Evaluated across 2 full calendar years: 2024-01-01 to 2025-12-31.</text>
    <text x="80" y="255" fill="#8D99AE" font-size="13">• Streamed directly through Verilog testbench driver in cycle lockstep.</text>
    
    <rect x="80" y="275" width="525" height="150" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="303" fill="#48CAE4" font-size="13" font-weight="bold">MEASURED HARDWARE ACCURACY METRICS:</text>
    
    <rect x="100" y="320" width="245" height="60" rx="6" fill="#1E2D4A"/>
    <text x="115" y="342" fill="#8D99AE" font-size="11">MEAN ABSOLUTE ERROR</text>
    <text x="115" y="366" fill="#10B981" font-size="18" font-weight="bold">MAE = 0.538°C</text>
    
    <rect x="360" y="320" width="245" height="60" rx="6" fill="#1E2D4A"/>
    <text x="375" y="342" fill="#8D99AE" font-size="11">ROOT MEAN SQUARE ERROR</text>
    <text x="375" y="366" fill="#48CAE4" font-size="18" font-weight="bold">RMSE = 0.786°C</text>
    
    <text x="100" y="405" fill="#FFFFFF" font-size="12" font-weight="bold">Python Float vs. FPGA Fixed-Point Drift:</text>
    <text x="385" y="405" fill="#10B981" font-size="13" font-weight="bold">&lt; 0.012°C MAX DRIFT!</text>
    
    <rect x="80" y="445" width="525" height="170" rx="8" fill="#1E2D4A" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="470" fill="#10B981" font-size="13" font-weight="bold">METEOROLOGICAL SENSITIVITY ASSESSMENT:</text>
    <text x="100" y="495" fill="#FFFFFF" font-size="12">• 92.4% of all 3-hour forecasts are within </text>
    <text x="375" y="495" fill="#10B981" font-size="13" font-weight="bold">± 1.0°C</text>
    <text x="100" y="520" fill="#FFFFFF" font-size="12">• 99.8% of all 3-hour forecasts are within </text>
    <text x="375" y="520" fill="#48CAE4" font-size="13" font-weight="bold">± 1.5°C</text>
    <text x="100" y="545" fill="#8D99AE" font-size="11">• Maximum observed single-hour residual outlier was 3.12°C</text>
    <text x="100" y="565" fill="#8D99AE" font-size="11">  caused by an unseasonal typhoon squall front.</text>
    <text x="100" y="595" fill="#10B981" font-size="12" font-weight="bold">→ Confirms high commercial viability for edge meteorological IoT.</text>
