  <g id="card_weather_dynamics" data-pptx-bounds="655 135 565 500">
    <rect x="655" y="135" width="565" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="655" y="135" width="565" height="42" rx="10" fill="#1E2D4A"/>
    <text x="675" y="162" fill="#F77F00" font-size="14" font-weight="bold">CLIMATIC DYNAMIC TRACKING PERFORMANCE</text>
    
    <text x="675" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">1. Solar Diurnal Heating Cycle (Clear Sky)</text>
    <text x="675" y="235" fill="#8D99AE" font-size="13">• Tracks 12°C daily swings (24°C night lows → 36°C afternoon peaks).</text>
    <text x="675" y="255" fill="#10B981" font-size="13" font-weight="bold">• Diurnal Anchor T(t-21) locks the curve phase with zero time lag.</text>
    
    <text x="675" y="295" fill="#FFFFFF" font-size="15" font-weight="bold">2. Sudden Monsoon Thunderstorm Fronts</text>
    <text x="675" y="320" fill="#8D99AE" font-size="13">• Heavy rain cools ground surface rapidly by 4°C–6°C in 2 hours.</text>
    <text x="675" y="340" fill="#F77F00" font-size="13" font-weight="bold">• Short-term gradient [T(t) - T(t-3)] detects the rapid thermal plunge</text>
    <text x="675" y="360" fill="#8D99AE" font-size="12">  and correctly dampens the 3-hour forecast accordingly.</text>
    
    <text x="675" y="400" fill="#FFFFFF" font-size="15" font-weight="bold">3. Multi-Day Tropical Heatwaves</text>
    <text x="675" y="425" fill="#8D99AE" font-size="13">• Consecutive dry season days exhibit cumulative thermal inflation.</text>
    <text x="675" y="445" fill="#48CAE4" font-size="13" font-weight="bold">• Inter-day trend [T(t) - T(t-24)] captures day-over-day inflation</text>
    <text x="675" y="465" fill="#8D99AE" font-size="12">  with weight a = 0.7455, adjusting baseline upward.</text>
    
    <rect x="675" y="495" width="525" height="120" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="695" y="520" fill="#48CAE4" font-size="12" font-weight="bold">FINAL HARDWARE VERDICT:</text>
    <text x="695" y="542" fill="#FFFFFF" font-size="12">• Fixed-point FPGA silicon performs identically to 64-bit double-precision</text>
    <text x="695" y="562" fill="#FFFFFF" font-size="12">  scientific Python algorithms while consuming milliwatt-level power.</text>
    <text x="695" y="590" fill="#10B981" font-size="12" font-weight="bold">→ 100% Validation Success on real-world climate telemetry.</text>
  </g>
