<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_05" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">MATHEMATICAL RESIDUAL FORMULATION</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Diurnal Residual Ordinary Least Squares Model</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Decomposing temperature dynamics into diurnal baseline, inter-day trend, and rate-of-change</text>
  </g>
  <g id="eq_hero" data-pptx-bounds="60 135 1160 110">
    <rect x="60" y="135" width="1160" height="110" rx="8" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">PREDICTION EQUATION (OLS FIT IN C++ / PYTHON):</text>
    <text x="80" y="202" fill="#0F172A" font-size="22" font-weight="bold">T_hat(t+3) = T(t-21) + a · [T(t) - T(t-24)] + b · [T(t) - T(t-3)] + c</text>
    <text x="80" y="228" fill="#2563EB" font-size="12" font-weight="bold">Coefficients:  a = 0.7455 (16'sh2FB6)  |  b = 0.0091 (16'sh0096)  |  c = 0.0011 °C (16'sh0000)</text>
  </g>
  <g id="term_anchor" data-pptx-bounds="60 265 280 370">
    <rect x="60" y="265" width="280" height="370" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="265" width="280" height="36" rx="8" fill="#F1F5F9"/>
    <text x="75" y="288" fill="#16A34A" font-size="11" font-weight="bold">DIURNAL ANCHOR</text>
    
    <rect x="75" y="315" width="250" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="200" y="341" fill="#16A34A" font-size="13" font-weight="bold" text-anchor="middle">T(t-21)</text>
    
    <text x="75" y="385" fill="#1E3A8A" font-size="12" font-weight="bold">Physical Function:</text>
    <text x="75" y="410" fill="#0F172A" font-size="11">• 24-hr solar baseline</text>
    <text x="75" y="435" fill="#334155" font-size="11">• Target: (t+3) - 24</text>
    <text x="75" y="460" fill="#334155" font-size="11">• Energy: &gt;85% variance</text>
    
    <rect x="75" y="505" width="250" height="110" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="85" y="533" fill="#1E3A8A" font-size="11" font-weight="bold">Hardware Budget:</text>
    <text x="85" y="560" fill="#16A34A" font-size="12" font-weight="bold">0 Mults (wire tap)</text>
    <text x="85" y="587" fill="#16A34A" font-size="10" font-weight="bold">Zero on-chip matrix solve</text>
  </g>
  <g id="term_trend" data-pptx-bounds="355 265 280 370">
