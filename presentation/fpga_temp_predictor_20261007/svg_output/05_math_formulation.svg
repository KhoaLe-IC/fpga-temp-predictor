<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_05" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">MATHEMATICAL FORMULATION</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Diurnal Residual Modeling: Mathematical Decomposition</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Physics-informed time-series equation isolating periodic diurnal heating, inter-day shifts, and short-term trends</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="box_equation" data-pptx-bounds="60 130 1160 145">
    <rect x="60" y="130" width="1160" height="145" rx="10" fill="#162238" stroke="#48CAE4" stroke-width="1.5"/>
    <text x="90" y="160" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">CORE LINEAR PREDICTION EQUATION (OLS FORMULATION)</text>
    
    <rect x="90" y="175" width="1100" height="52" rx="6" fill="#0B132B"/>
    <text x="110" y="210" fill="#FFFFFF" font-size="22" font-weight="bold">
      T_hat(t+3) = <tspan fill="#48CAE4">T(t-21)</tspan> + <tspan fill="#F77F00">a</tspan>·[T(t) - T(t-24)] + <tspan fill="#10B981">b</tspan>·[T(t) - T(t-3)] + <tspan fill="#8D99AE">c</tspan>
    </text>
    
    <text x="90" y="255" fill="#8D99AE" font-size="12">
      Trained offline via Ordinary Least Squares on 26,280 samples (2021–2023) to globally minimize Mean Squared Error (MSE).
    </text>
  </g>
  <g id="term_anchor" data-pptx-bounds="60 295 365 345">
    <rect x="60" y="295" width="365" height="345" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="295" width="365" height="40" rx="10" fill="#1E2D4A"/>
    <text x="80" y="321" fill="#48CAE4" font-size="14" font-weight="bold">TERM 1: DIURNAL ANCHOR T(t-21)</text>
    
    <text x="80" y="365" fill="#FFFFFF" font-size="14" font-weight="bold">Temporal Index Derivation:</text>
    <text x="80" y="387" fill="#8D99AE" font-size="13">• Target hour: (t + 3).</text>
    <text x="80" y="407" fill="#8D99AE" font-size="13">• Exactly 24 hours prior to target:</text>
    <text x="80" y="427" fill="#48CAE4" font-size="14" font-weight="bold">  (t + 3) - 24 = t - 21</text>
    
    <text x="80" y="465" fill="#FFFFFF" font-size="14" font-weight="bold">Physical Insight:</text>
    <text x="80" y="487" fill="#8D99AE" font-size="13">• Captures identical solar elevation angle</text>
    <text x="80" y="507" fill="#8D99AE" font-size="13">  from yesterday's diurnal cycle.</text>
    <text x="80" y="527" fill="#8D99AE" font-size="13">• Serves as the base baseline pedestal.</text>
    
    <rect x="80" y="555" width="325" height="65" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="95" y="580" fill="#10B981" font-size="12" font-weight="bold">Error Reduction Alone:</text>
    <text x="95" y="600" fill="#8D99AE" font-size="12">Slashes MAE from 2.08°C down to 0.83°C!</text>
  </g>
  <g id="term_trend" data-pptx-bounds="455 295 365 345">
    <rect x="455" y="295" width="365" height="345" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="455" y="295" width="365" height="40" rx="10" fill="#1E2D4A"/>
    <text x="475" y="321" fill="#F77F00" font-size="14" font-weight="bold">TERM 2: INTER-DAY TREND</text>
    
    <text x="475" y="365" fill="#FFFFFF" font-size="14" font-weight="bold">Difference Formulation: D1</text>
    <text x="475" y="387" fill="#F77F00" font-size="14" font-weight="bold">D1 = T(t) - T(t-24)</text>
    <text x="475" y="410" fill="#8D99AE" font-size="13">• Compares current observation T(t) to the</text>
    <text x="475" y="430" fill="#8D99AE" font-size="13">  exact same hour yesterday T(t-24).</text>
    
    <text x="475" y="465" fill="#FFFFFF" font-size="14" font-weight="bold">Physical Insight &amp; Weight a:</text>
    <text x="475" y="487" fill="#8D99AE" font-size="13">• Captures multi-day weather fronts,</text>
    <text x="475" y="507" fill="#8D99AE" font-size="13">  heatwaves, or persistent cloud cover.</text>
    
    <rect x="475" y="535" width="325" height="85" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="490" y="560" fill="#F77F00" font-size="12" font-weight="bold">Optimal OLS Weight: a ≈ 0.745502</text>
    <text x="490" y="582" fill="#8D99AE" font-size="12">• Strongest predictive parameter in model.</text>
    <text x="490" y="602" fill="#FFFFFF" font-size="12">• Hardware Q2.14: A = 12214 (0.745483)</text>
  </g>
  <g id="term_gradient" data-pptx-bounds="850 295 370 345">
    <rect x="850" y="295" width="370" height="345" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="850" y="295" width="370" height="40" rx="10" fill="#1E2D4A"/>
    <text x="870" y="321" fill="#10B981" font-size="14" font-weight="bold">TERM 3: SHORT-TERM GRADIENT</text>
    
    <text x="870" y="365" fill="#FFFFFF" font-size="14" font-weight="bold">Difference Formulation: D2</text>
    <text x="870" y="387" fill="#10B981" font-size="14" font-weight="bold">D2 = T(t) - T(t-3)</text>
    <text x="870" y="410" fill="#8D99AE" font-size="13">• Rate of temperature change over the</text>
    <text x="870" y="430" fill="#8D99AE" font-size="13">  immediate past 3 observation hours.</text>
    
    <text x="870" y="465" fill="#FFFFFF" font-size="14" font-weight="bold">Physical Insight &amp; Weight b, c:</text>
    <text x="870" y="487" fill="#8D99AE" font-size="13">• Captures sudden morning solar ramps or</text>
    <text x="870" y="507" fill="#8D99AE" font-size="13">  afternoon rainstorm temperature drops.</text>
    
    <rect x="870" y="535" width="330" height="85" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="885" y="560" fill="#10B981" font-size="12" font-weight="bold">Optimal OLS Weight: b ≈ 0.009139</text>
    <text x="885" y="582" fill="#8D99AE" font-size="12">• Fine short-term damping gradient.</text>
    <text x="885" y="602" fill="#FFFFFF" font-size="12">• Hardware Q2.14: B = 150 (0.009155)</text>
  </g>
  <g id="ftr_05" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Parameter Weights: a = 0.745502 (Day Trend) | b = 0.009139 (3-hr Gradient) | c = 0.001147 (DC Thermal Bias)</text>
  </g>
</svg>
