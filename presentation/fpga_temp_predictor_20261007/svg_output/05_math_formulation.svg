    <text x="370" y="385" fill="#1E3A8A" font-size="12" font-weight="bold">Physical Function:</text>
    <text x="370" y="410" fill="#0F172A" font-size="11">• 24-hr weather front delta</text>
    <text x="370" y="435" fill="#334155" font-size="11">• Shift from yesterday</text>
    <text x="370" y="460" fill="#334155" font-size="11">• Weight: a = 0.7455</text>
    
