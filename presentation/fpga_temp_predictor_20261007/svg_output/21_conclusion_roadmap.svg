    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">CORE ENGINEERING ACHIEVEMENTS</text>
    
    <text x="80" y="205" fill="#0F172A" font-size="13" font-weight="bold">1. Model-to-Silicon Workflow</text>
    <text x="80" y="228" fill="#334155" font-size="11">• 43,800h NASA data: 0.538°C MAE (74.1% gain vs persistence)</text>
    
    <text x="80" y="265" fill="#0F172A" font-size="13" font-weight="bold">2. Dual Synthesizable RTL Cores</text>
    <text x="80" y="288" fill="#334155" font-size="11">• Speed Core: 6-stage pipeline, II=1, 142.3 MHz F_max, 412 LEs</text>
    <text x="80" y="308" fill="#334155" font-size="11">• Resource Core: 10-state FSM, 1 shared mult, 236 LEs (-42.7%)</text>
    
    <text x="80" y="345" fill="#0F172A" font-size="13" font-weight="bold">3. 100% Bit-Exact Verification via DPI-C</text>
    <text x="80" y="368" fill="#334155" font-size="11">• SystemVerilog testbench paired with live C++ golden oracle</text>
    <text x="80" y="388" fill="#16A34A" font-size="11" font-weight="bold">• 0 mismatches across 10,000+ synthetic and 17,520h test vectors</text>
    
    <text x="80" y="425" fill="#0F172A" font-size="13" font-weight="bold">4. Standalone Cyclone II DE2 System</text>
    <text x="80" y="448" fill="#334155" font-size="11">• RS-232 UART receiver and BCD 7-segment display logic</text>
    
