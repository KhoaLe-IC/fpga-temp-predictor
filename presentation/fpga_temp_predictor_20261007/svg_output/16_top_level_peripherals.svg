    <text x="1040" y="450" fill="#1E3A8A" font-size="10" font-weight="bold">UART TRANSMITTER</text>
    <text x="1040" y="470" fill="#0F172A" font-size="10" font-weight="bold">uart_tx.v</text>
    <text x="1040" y="487" fill="#334155" font-size="9">• 115,200 Baud 8-N-1 Serializer</text>
    <text x="1040" y="503" fill="#334155" font-size="9">• Automatic FIFO pop on idle</text>
    <rect x="1038" y="513" width="158" height="20" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
    <text x="1117" y="527" fill="#16A34A" font-size="9" font-weight="bold" text-anchor="middle">Pin: UART_TX Output</text>
    
    <!-- Bottom Spec Strip for Design B -->
    <rect x="75" y="585" width="1130" height="42" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
    <text x="90" y="605" fill="#1E3A8A" font-size="10" font-weight="bold">Resource System Contract:</text>
    <text x="245" y="605" fill="#334155" font-size="10">Dual 16-byte FIFO buffering • Autonomous UART controller FSM • 1 shared multiplier (-50% DSP) • 236 LEs (-42.7%)</text>
    <text x="90" y="620" fill="#16A34A" font-size="9" font-weight="bold">• Power-On-Reset counter (128 cycles) eliminates external reset pushbutton dependency.</text>
  </g>
  <g id="ftr_16" data-pptx-bounds="60 655 1160 40">
