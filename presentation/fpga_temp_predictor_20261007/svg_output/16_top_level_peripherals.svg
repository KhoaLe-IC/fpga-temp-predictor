  </g>
  <g id="top_resource_wrapper" data-pptx-bounds="60 388 1160 248">
    <rect x="60" y="388" width="1160" height="248" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
