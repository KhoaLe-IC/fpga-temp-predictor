    <text x="85" y="215" fill="#334155" font-size="9">• CLOCK_50 (50MHz)</text>
    <text x="85" y="232" fill="#334155" font-size="9">• KEY0_N (Button)</text>
    <rect x="82" y="244" width="96" height="32" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="130" y="258" fill="#1E3A8A" font-size="9" font-weight="bold" text-anchor="middle">reset_sync.v</text>
    <text x="130" y="270" fill="#2563EB" font-size="8" text-anchor="middle">rst_n (Sync)</text>
    
    <!-- Connector 1 -> 2 -->
    <line x1="185" y1="230" x2="200" y2="230" stroke="#2563EB" stroke-width="1.5"/>
    
