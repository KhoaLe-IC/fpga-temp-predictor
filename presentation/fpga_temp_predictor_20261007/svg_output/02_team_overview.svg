    <text x="870" y="162" fill="#48CAE4" font-size="14" font-weight="bold">PILLAR 3: VERIFICATION &amp; FPGA</text>
    
    <text x="870" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">SystemVerilog DPI-C Co-Sim</text>
    <text x="870" y="235" fill="#8D99AE" font-size="13">• Live C++ reference oracle (ols_reference.hpp)</text>
    <text x="870" y="255" fill="#8D99AE" font-size="13">• Cycle-accurate scoreboard checking</text>
    <text x="870" y="275" fill="#8D99AE" font-size="13">• Zero-tolerance: 0 LSB mismatch allowed</text>
    
    <text x="870" y="315" fill="#FFFFFF" font-size="15" font-weight="bold">7-Phase Corner-Case Suite</text>
    <text x="870" y="340" fill="#8D99AE" font-size="13">• 24-sample warm-up lockout verification</text>
    <text x="870" y="360" fill="#8D99AE" font-size="13">• Extreme thermal saturation sweeps (sat16)</text>
    <text x="870" y="380" fill="#8D99AE" font-size="13">• 4,096-sample bursts &amp; random stalls</text>
    
    <text x="870" y="420" fill="#FFFFFF" font-size="15" font-weight="bold">Cyclone II Physical Synthesis</text>
    <text x="870" y="445" fill="#8D99AE" font-size="13">• Fmax > 125 MHz (2.5x timing margin)</text>
    <text x="870" y="465" fill="#8D99AE" font-size="13">• Resource usage: &lt;1% Logic Elements</text>
    <text x="870" y="485" fill="#8D99AE" font-size="13">• Ultra-low power: ~11.8 mW dynamic</text>
    
    <rect x="870" y="530" width="330" height="85" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
