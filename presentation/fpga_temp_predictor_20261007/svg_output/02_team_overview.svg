    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">PILLAR 1: DSP &amp; ALGORITHMS</text>
    
    <text x="80" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Meteorological Time-Series</text>
    <text x="80" y="235" fill="#8D99AE" font-size="13">• NASA POWER satellite API integration</text>
    <text x="80" y="255" fill="#8D99AE" font-size="13">• 5-year HCMC hourly dataset (43,800 pts)</text>
    <text x="80" y="275" fill="#8D99AE" font-size="13">• Diurnal residual formulation: T(t-21)</text>
    
    <text x="80" y="315" fill="#FFFFFF" font-size="15" font-weight="bold">Model Benchmark Suite</text>
    <text x="80" y="340" fill="#8D99AE" font-size="13">• Evaluated OLS, Ridge, MLP, GBDT</text>
    <text x="80" y="360" fill="#8D99AE" font-size="13">• Offline OLS parameter extraction in C++</text>
    <text x="80" y="380" fill="#8D99AE" font-size="13">• Target MAE: 0.538°C on test data</text>
    
    <text x="80" y="420" fill="#FFFFFF" font-size="15" font-weight="bold">Numerical Specifications</text>
    <text x="80" y="445" fill="#8D99AE" font-size="13">• Signed Q8.8 inputs &amp; outputs (LSB=1/256)</text>
    <text x="80" y="465" fill="#8D99AE" font-size="13">• Signed Q2.14 multiplier coefficients</text>
    <text x="80" y="485" fill="#8D99AE" font-size="13">• Symmetric rounding &amp; floor scaling</text>
    
