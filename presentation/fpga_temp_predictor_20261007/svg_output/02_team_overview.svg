    <text x="95" y="575" fill="#8D99AE" font-size="12">• data/hcmc_t2m_2021_2025.csv</text>
    <text x="95" y="595" fill="#8D99AE" font-size="12">• software/train_models.py, benchmark.py</text>
  </g>
  <g id="pillar_rtl" data-pptx-bounds="455 135 365 500">
