    <text x="475" y="162" fill="#48CAE4" font-size="14" font-weight="bold">PILLAR 2: MICRO-ARCHITECTURE &amp; RTL</text>
    
    <text x="475" y="210" fill="#FFFFFF" font-size="15" font-weight="bold">Speed Core (temp_predictor_speed)</text>
    <text x="475" y="235" fill="#8D99AE" font-size="13">• Fully pipelined 6-stage feed-forward</text>
    <text x="475" y="255" fill="#8D99AE" font-size="13">• Initiation Interval II = 1 clock cycle</text>
    <text x="475" y="275" fill="#8D99AE" font-size="13">• Throughput: 50 MSamples/sec @ 50 MHz</text>
    
    <text x="475" y="315" fill="#FFFFFF" font-size="15" font-weight="bold">Resource Core (temp_predictor_resource)</text>
    <text x="475" y="340" fill="#8D99AE" font-size="13">• Time-multiplexed 10-state FSM datapath</text>
    <text x="475" y="360" fill="#8D99AE" font-size="13">• Shares 1 DSP mult &amp; 1 subtractor ALU</text>
    <text x="475" y="380" fill="#8D99AE" font-size="13">• Backpressure handshake: sample_ready</text>
    
    <text x="475" y="420" fill="#FFFFFF" font-size="15" font-weight="bold">Top-Level SoC Integration</text>
    <text x="475" y="445" fill="#8D99AE" font-size="13">• 115,200 Baud UART RX/TX telemetry</text>
    <text x="475" y="465" fill="#8D99AE" font-size="13">• Packet parser, formatter, and FIFO</text>
    <text x="475" y="485" fill="#8D99AE" font-size="13">• Metastability reset_sync synchronizer</text>
    
    <rect x="475" y="530" width="325" height="85" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="490" y="555" fill="#48CAE4" font-size="12" font-weight="bold">Deliverable Artifacts:</text>
    <text x="490" y="575" fill="#8D99AE" font-size="12">• hardware/speed_optimized/ (Verilog)</text>
    <text x="490" y="595" fill="#8D99AE" font-size="12">• hardware/resource_optimized/ (Verilog)</text>
  </g>
  <g id="pillar_dv" data-pptx-bounds="850 135 370 500">
