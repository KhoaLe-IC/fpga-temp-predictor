    <text x="885" y="575" fill="#8D99AE" font-size="12">• hardware/tb/ols_tb_driver.sv, dpi/</text>
    <text x="885" y="595" fill="#8D99AE" font-size="12">• 100% test pass rate on 10,000+ vectors</text>
