<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B132B"/>
  <g id="hdr_19" data-pptx-bounds="60 30 1160 85">
    <text x="60" y="52" fill="#48CAE4" font-size="13" font-weight="bold" letter-spacing="1">PHYSICAL IMPLEMENTATION METRICS</text>
    <text x="60" y="86" fill="#FFFFFF" font-size="26" font-weight="bold">Synthesis &amp; Physical Implementation on Altera Cyclone II</text>
    <text x="60" y="108" fill="#8D99AE" font-size="14">Resource utilization, maximum operating frequency (Fmax), and power analysis on EP2C35F672C6</text>
    <line x1="60" y1="114" x2="1220" y2="114" stroke="#2A3D66" stroke-width="1"/>
  </g>
  <g id="table_synthesis" data-pptx-bounds="60 135 760 500">
    <rect x="60" y="135" width="760" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="60" y="135" width="760" height="42" rx="10" fill="#1E2D4A"/>
    <text x="80" y="162" fill="#48CAE4" font-size="14" font-weight="bold">PHYSICAL SYNTHESIS RESULTS (QUARTUS II / TIMEQUEST)</text>
    
    <!-- Table Header Row -->
    <rect x="80" y="195" width="720" height="34" rx="4" fill="#0B132B"/>
    <text x="95" y="217" fill="#8D99AE" font-size="12" font-weight="bold">RESOURCE / METRIC</text>
    <text x="310" y="217" fill="#48CAE4" font-size="12" font-weight="bold">SPEED CORE</text>
    <text x="450" y="217" fill="#10B981" font-size="12" font-weight="bold">RESOURCE CORE</text>
    <text x="600" y="217" fill="#8D99AE" font-size="12" font-weight="bold">EP2C35 BUDGET</text>
    <text x="715" y="217" fill="#8D99AE" font-size="12" font-weight="bold">UTIL %</text>
    
    <!-- Row 1: Logic Elements -->
    <rect x="80" y="235" width="720" height="38" rx="4" fill="#1E2D4A" fill-opacity="0.5"/>
    <text x="95" y="259" fill="#FFFFFF" font-size="13">Logic Elements (LEs)</text>
    <text x="310" y="259" fill="#48CAE4" font-size="13" font-weight="bold">~320 LEs</text>
    <text x="450" y="259" fill="#10B981" font-size="13" font-weight="bold">~245 LEs</text>
    <text x="600" y="259" fill="#8D99AE" font-size="13">33,216 LEs</text>
    <text x="715" y="259" fill="#10B981" font-size="13">&lt;1.0%</text>
    
    <!-- Row 2: Multipliers -->
    <rect x="80" y="278" width="720" height="38" rx="4" fill="#162238"/>
    <text x="95" y="302" fill="#FFFFFF" font-size="13">Embedded Multipliers</text>
    <text x="310" y="302" fill="#F77F00" font-size="13" font-weight="bold">2 / 35 blocks</text>
    <text x="450" y="302" fill="#10B981" font-size="13" font-weight="bold">1 / 35 blocks</text>
    <text x="600" y="302" fill="#8D99AE" font-size="13">35 blocks</text>
    <text x="715" y="302" fill="#48CAE4" font-size="13">2.8%–5.7%</text>
    
    <!-- Row 3: Memory Bits -->
    <rect x="80" y="321" width="720" height="38" rx="4" fill="#1E2D4A" fill-opacity="0.5"/>
    <text x="95" y="345" fill="#FFFFFF" font-size="13">Block RAM (M4K)</text>
    <text x="310" y="345" fill="#10B981" font-size="13">0 bits (Pure logic)</text>
    <text x="450" y="345" fill="#10B981" font-size="13">0 bits (Pure logic)</text>
    <text x="600" y="345" fill="#8D99AE" font-size="13">483,840 bits</text>
    <text x="715" y="345" fill="#10B981" font-size="13">0.0%</text>
    
    <!-- Row 4: Fmax -->
    <rect x="80" y="364" width="720" height="42" rx="4" fill="#48CAE4" fill-opacity="0.15" stroke="#48CAE4" stroke-width="1.5"/>
    <text x="95" y="390" fill="#48CAE4" font-size="13" font-weight="bold">Max Clock Frequency (Fmax)</text>
    <text x="310" y="390" fill="#48CAE4" font-size="14" font-weight="bold">128.5 MHz</text>
    <text x="450" y="390" fill="#10B981" font-size="14" font-weight="bold">142.1 MHz</text>
    <text x="600" y="390" fill="#FFFFFF" font-size="13">50.0 MHz Target</text>
    <text x="715" y="390" fill="#10B981" font-size="14" font-weight="bold">+157% Slack</text>
    
    <!-- Row 5: Dynamic Power -->
    <rect x="80" y="411" width="720" height="38" rx="4" fill="#162238"/>
    <text x="95" y="435" fill="#FFFFFF" font-size="13">Est. Dynamic Power @ 50MHz</text>
    <text x="310" y="435" fill="#FFFFFF" font-size="13">~11.8 mW</text>
    <text x="450" y="435" fill="#10B981" font-size="13" font-weight="bold">~8.4 mW</text>
    <text x="600" y="435" fill="#8D99AE" font-size="13">Milliwatt class</text>
    <text x="715" y="435" fill="#10B981" font-size="13">Ultra-low</text>
    
    <!-- Row 6: Latency -->
    <rect x="80" y="454" width="720" height="38" rx="4" fill="#1E2D4A" fill-opacity="0.5"/>
    <text x="95" y="478" fill="#FFFFFF" font-size="13">Propagation Delay to Valid</text>
    <text x="310" y="478" fill="#48CAE4" font-size="13">100.0 ns (5 cycles)</text>
    <text x="450" y="478" fill="#10B981" font-size="13">180.0 ns (9 cycles)</text>
    <text x="600" y="478" fill="#8D99AE" font-size="13">Real-time</text>
    <text x="715" y="478" fill="#10B981" font-size="13">Instant</text>
    
    <!-- Bottom note -->
    <rect x="80" y="505" width="720" height="110" rx="6" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="100" y="530" fill="#48CAE4" font-size="12" font-weight="bold">PHYSICAL DESIGN HIGHLIGHTS:</text>
    <text x="100" y="552" fill="#FFFFFF" font-size="12">• Massive Timing Slack: Fmax &gt; 128 MHz allows core to comfortably exceed 50 MHz DE2 board clock.</text>
    <text x="100" y="572" fill="#FFFFFF" font-size="12">• Zero BRAM Footprint: Registers fit inside logic slices, leaving all M4K blocks for UART buffers.</text>
    <text x="100" y="595" fill="#10B981" font-size="12" font-weight="bold">• Power Efficiency: Core dissipates &lt;12 mW, meeting extreme low-power IoT constraints.</text>
  </g>
  <g id="card_synth_insights" data-pptx-bounds="845 135 375 500">
    <rect x="845" y="135" width="375" height="500" rx="10" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="845" y="135" width="375" height="42" rx="10" fill="#1E2D4A"/>
    <text x="865" y="162" fill="#48CAE4" font-size="14" font-weight="bold">SYNTHESIS TAKEAWAYS</text>
    
    <rect x="865" y="195" width="335" height="120" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="880" y="222" fill="#8D99AE" font-size="11">TIMING MARGIN OVER 50 MHz</text>
    <text x="880" y="260" fill="#10B981" font-size="32" font-weight="bold">2.57× SLACK</text>
    <text x="880" y="295" fill="#FFFFFF" font-size="12">Fmax = 128.5 MHz vs 50 MHz clock</text>
    
    <rect x="865" y="330" width="335" height="120" rx="8" fill="#0B132B" stroke="#2A3D66" stroke-width="1"/>
    <text x="880" y="357" fill="#8D99AE" font-size="11">TOTAL FPGA LOGIC FOOTPRINT</text>
    <text x="880" y="395" fill="#48CAE4" font-size="32" font-weight="bold">&lt; 1.0 %</text>
    <text x="880" y="430" fill="#FFFFFF" font-size="12">Only 320 LEs out of 33,216 available</text>
    
    <rect x="865" y="465" width="335" height="150" rx="8" fill="#1E2D4A" stroke="#2A3D66" stroke-width="1"/>
    <text x="880" y="492" fill="#10B981" font-size="12" font-weight="bold">ACADEMIC &amp; INDUSTRY CONCLUSION:</text>
    <text x="880" y="515" fill="#FFFFFF" font-size="12">• Clean RTL coding standards yield zero</text>
    <text x="880" y="535" fill="#FFFFFF" font-size="12">  critical-path routing bottlenecks.</text>
    <text x="880" y="555" fill="#8D99AE" font-size="12">• Multipliers mapped directly to dedicated</text>
    <text x="880" y="575" fill="#8D99AE" font-size="12">  hard-macro silicon blocks.</text>
    <text x="880" y="598" fill="#48CAE4" font-size="12" font-weight="bold">→ Ready for full DE2 laboratory deployment.</text>
  </g>
  <g id="ftr_19" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#162238" stroke="#2A3D66" stroke-width="1"/>
    <rect x="72" y="663" width="130" height="22" rx="4" fill="#48CAE4" fill-opacity="0.2"/>
    <text x="137" y="678" fill="#48CAE4" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="220" y="679" fill="#FFFFFF" font-size="13">Synthesis Summary: Fmax > 128 MHz (2.5x margin over 50 MHz clock); consumes &lt;1% LEs and 0 BRAM on Cyclone II</text>
  </g>
</svg>
