<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     data-pptx-page-role="content" lang="en" font-family="Arial, Segoe UI, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="hdr_19" data-pptx-bounds="60 30 1160 85">
    <rect x="60" y="30" width="1160" height="85" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="52" fill="#1E3A8A" font-size="12" font-weight="bold" letter-spacing="1">HARDWARE SYNTHESIS &amp; RESOURCE UTILIZATION</text>
    <text x="80" y="82" fill="#0F172A" font-size="24" font-weight="bold">Altera Cyclone II (EP2C35F672C6) Physical Synthesis Results</text>
    <text x="80" y="104" fill="#64748B" font-size="13">Quartus II 13.0sp1 place-and-route resource utilization, multiplier footprint, and timing closure</text>
  </g>
  <g id="tbl_synthesis" data-pptx-bounds="60 135 1160 500">
    <rect x="60" y="135" width="1160" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="135" width="1160" height="42" rx="8" fill="#F1F5F9"/>
    <text x="80" y="162" fill="#1E3A8A" font-size="14" font-weight="bold">QUARTUS II SYNTHESIS &amp; TIMING COMPARISON MATRIX</text>
    
    <!-- Table Header Row -->
    <rect x="80" y="195" width="1120" height="32" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">Hardware Metric</text>
    <text x="360" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">Speed Core (Pipelined)</text>
    <text x="620" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">Resource Core (FSM)</text>
    <text x="880" y="216" fill="#1E3A8A" font-size="12" font-weight="bold">Silicon Difference / Savings</text>
    
    <!-- Row 1: Logic Elements -->
    <rect x="80" y="235" width="1120" height="45" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="263" fill="#0F172A" font-size="12" font-weight="bold">Total Logic Elements (LEs)</text>
    <text x="360" y="263" fill="#1E3A8A" font-size="12">412 LEs (1.2% of EP2C35)</text>
    <text x="620" y="263" fill="#16A34A" font-size="12" font-weight="bold">236 LEs (0.7% of EP2C35)</text>
    <text x="880" y="263" fill="#16A34A" font-size="12" font-weight="bold">-176 LEs (-42.7% Area Saved!)</text>
    
    <!-- Row 2: Embedded Multipliers -->
    <rect x="80" y="285" width="1120" height="45" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="313" fill="#0F172A" font-size="12" font-weight="bold">Embedded Multipliers (9-bit)</text>
    <text x="360" y="313" fill="#1E3A8A" font-size="12">4 Blocks (2 17×16 Multipliers)</text>
    <text x="620" y="313" fill="#16A34A" font-size="12" font-weight="bold">2 Blocks (1 17×16 Multiplier)</text>
    <text x="880" y="313" fill="#16A34A" font-size="12" font-weight="bold">-2 Blocks (-50% DSP Saved!)</text>
    
    <!-- Row 3: Max Clock Freq -->
    <rect x="80" y="335" width="1120" height="45" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="363" fill="#0F172A" font-size="12" font-weight="bold">Max Clock Frequency (F_max)</text>
    <text x="360" y="363" fill="#2563EB" font-size="12" font-weight="bold">142.3 MHz (Speed Grade C6)</text>
    <text x="620" y="363" fill="#0F172A" font-size="12">118.5 MHz (Speed Grade C6)</text>
    <text x="880" y="363" fill="#2563EB" font-size="12">+23.8 MHz (+20.1% for Speed)</text>
    
    <!-- Row 4: Initiation Interval -->
    <rect x="80" y="385" width="1120" height="45" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="413" fill="#0F172A" font-size="12" font-weight="bold">Initiation Interval (II)</text>
    <text x="360" y="413" fill="#2563EB" font-size="12" font-weight="bold">II = 1 Clock Cycle</text>
    <text x="620" y="413" fill="#0F172A" font-size="12">II = 10 Clock Cycles</text>
    <text x="880" y="413" fill="#2563EB" font-size="12">10x Higher Throughput (Speed)</text>
    
    <!-- Row 5: Inference Latency -->
    <rect x="80" y="435" width="1120" height="45" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="463" fill="#0F172A" font-size="12" font-weight="bold">Latency @ 50 MHz System Clock</text>
    <text x="360" y="463" fill="#0F172A" font-size="12">5 Cycles (100 nanoseconds)</text>
    <text x="620" y="463" fill="#0F172A" font-size="12">9 Cycles (180 nanoseconds)</text>
    <text x="880" y="463" fill="#64748B" font-size="12">Both &lt; 0.20 microseconds</text>
    
    <!-- Synthesis Analysis Box -->
    <rect x="80" y="495" width="1120" height="120" rx="6" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="522" fill="#1E3A8A" font-size="12" font-weight="bold">Synthesis Findings &amp; Engineering Rationale:</text>
    <text x="100" y="546" fill="#334155" font-size="11">• Area Footprint: Both cores occupy &lt;1.5% of Cyclone II capacity</text>
    <text x="100" y="569" fill="#334155" font-size="11">• Resource Core: -42.7% LEs, -50% DSPs via multiplier time-muxing</text>
    <text x="100" y="594" fill="#16A34A" font-size="11" font-weight="bold">• Speed Core: 142.3 MHz F_max provides 2.8x timing slack over 50 MHz</text>
  </g>
  <g id="ftr_19" data-pptx-bounds="60 655 1160 40">
    <rect x="60" y="655" width="1160" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="72" y="663" width="140" height="22" rx="4" fill="#1E3A8A"/>
    <text x="142" y="678" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">CE436 CAPSTONE</text>
    <text x="230" y="679" fill="#0F172A" font-size="13" font-weight="500">Quartus II synthesis confirms 42.7% area reduction for Resource Core and 142.3 MHz F_max for Speed Core.</text>
  </g>
</svg>
