<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="28" data-pptx-master="presentation_core_master" data-pptx-master-name="Presentation Core" data-pptx-layout="schematic-title" data-pptx-layout-name="Schematic Title">
<rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false" />
<rect id="title-only-rule" x="64" y="120" width="1152" height="2" fill="#E0E0E0" data-pptx-layer="layout" />
<g id="title-only-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 40 1152 72">
  <text data-pptx-carrier="true" x="64" y="90" font-size="50" font-weight="bold" fill="#161616">Linear Model with Diurnal Anchor &amp; Taps</text>
</g>
<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28">
  <text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">04 / 15</text>
</g>
<g id="formula-box" data-pptx-bounds="64 140 1152 85">
  <rect x="64" y="140" width="1152" height="85" rx="4" fill="#F4F4F4" />
  <text x="88" y="195" font-size="30" font-weight="bold" fill="#161616">T̂(t+3) = <tspan fill="#002D9C">T(t−21)</tspan> + a[T(t) − T(t−24)] + b[T(t) − T(t−3)] + c</text>
</g>
<g id="taps-panel" data-pptx-bounds="64 245 560 380">
  <rect x="64" y="245" width="560" height="380" rx="4" fill="#F4F4F4" />
  <text x="88" y="290" font-size="26" font-weight="bold" fill="#002D9C">PHYSICAL MEANING OF TAPS</text>
  <text x="88" y="345" font-size="24" font-weight="bold" fill="#0F62FE">• T(t−21): Diurnal Anchor</text>
  <text x="110" y="380" font-size="24" fill="#525252">Same hour yesterday: (t+3) − 24 = t − 21</text>
  <text x="88" y="435" font-size="24" font-weight="bold" fill="#0F62FE">• T(t) − T(t−24): Inter-Day Trend</text>
  <text x="110" y="470" font-size="24" fill="#525252">Today vs. yesterday at current hour</text>
  <text x="88" y="525" font-size="24" font-weight="bold" fill="#0F62FE">• T(t) − T(t−3): Recent Gradient</text>
  <text x="110" y="560" font-size="24" fill="#525252">Latest 3-hour temperature rate of change</text>
</g>
<g id="math-walkthrough" data-pptx-bounds="656 245 560 380">
  <rect x="656" y="245" width="560" height="380" rx="4" fill="#F4F4F4" />
  <text x="680" y="290" font-size="26" font-weight="bold" fill="#002D9C">NUMERICAL WALKTHROUGH</text>
  <text font-size="24" fill="#161616" font-family="Consolas" x="680" y="345">Inputs: T(t−24)=19°, T(t−21)=21°</text><text font-size="24" fill="#161616" font-family="Consolas" x="680" y="383">        T(t−3)=18°,  T(t)=20°C</text><text x="680" y="435" font-family="Consolas" font-size="24" fill="#525252">Weights: a = 0.5, b = 0.2, c = 0.0</text>
  <line x1="680" y1="465" x2="1176" y2="465" stroke="#E0E0E0" />
  <text x="680" y="515" font-weight="bold" fill="#002D9C">21 + 0.5(1) + 0.2(2) = 21.9°C</text>
  <text x="680" y="565" font-size="22" font-weight="bold" fill="#0F62FE">Datapath: Subtract  →  Multiply  →  Adder Tree</text>
</g>
