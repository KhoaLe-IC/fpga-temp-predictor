</g>
<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28">
  <text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">06 / 15</text>
</g>
<g id="left-card" data-pptx-bounds="64 150 552 470">
  <rect x="64" y="150" width="552" height="470" rx="4" fill="#F4F4F4" />
  <text x="88" y="200" font-weight="bold" fill="#002D9C">EVALUATION METRIC: MAE</text>
  <text x="88" y="255" font-size="24" fill="#525252">Mean Absolute Error on held-out test data:</text>
  <text x="88" y="315" font-family="Consolas" font-size="26" font-weight="bold" fill="#002D9C">MAE = (1/N) ∑ |T̂(i) − T_true(i)|</text>
  <line x1="88" y1="365" x2="584" y2="365" stroke="#E0E0E0" />
  <text x="88" y="420" font-size="26" font-weight="bold" fill="#161616">Core Evaluation Question:</text>
  <text font-size="24" fill="#161616" x="88" y="470">Does our hardware model actually</text><text font-size="24" fill="#161616" x="88" y="504">outperform simple no-math heuristics?</text></g>
<g id="right-card" data-pptx-bounds="664 150 552 470">
  <rect x="664" y="150" width="552" height="470" rx="4" fill="#F4F4F4" />
  <text x="688" y="200" font-weight="bold" fill="#002D9C">TWO NAIVE BASELINES</text>
  <text x="688" y="255" font-size="24" font-weight="bold" fill="#161616">1. Persistence Baseline: T̂(t+3) = T(t)</text>
  <text x="710" y="295" font-size="22" fill="#525252">Assumes temperature stays unchanged</text>
  <text x="688" y="365" font-size="24" font-weight="bold" fill="#161616">2. Diurnal Baseline: T̂(t+3) = T(t−21)</text>
  <text x="710" y="405" font-size="22" fill="#525252">Assumes today repeats yesterday at same hour</text>
  <line x1="688" y1="455" x2="1184" y2="455" stroke="#E0E0E0" />
  <text x="688" y="505" font-size="24" font-weight="bold" fill="#0F62FE">Academic Integrity Standard:</text>
  <text font-size="22" fill="#161616" x="688" y="545">Residuals and MAE are reported honestly.</text><text font-size="22" fill="#161616" x="688" y="573">Evaluated on identical test period.</text></g>
