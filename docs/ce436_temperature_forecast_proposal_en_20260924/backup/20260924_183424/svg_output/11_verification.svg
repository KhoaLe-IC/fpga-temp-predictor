  <text x="480" y="465" font-size="22" fill="#525252">Target: 100% BIT-EXACT<tspan x="480" dy="30">• Reset sequence</tspan><tspan x="480" dy="30">• 25-sample buffer warm-up</tspan><tspan x="480" dy="30">• Pauses/gaps in valid_in</tspan></text>
