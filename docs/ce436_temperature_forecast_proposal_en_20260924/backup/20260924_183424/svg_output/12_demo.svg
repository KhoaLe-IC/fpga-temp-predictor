<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="28" data-pptx-master="presentation_core_master" data-pptx-master-name="Presentation Core" data-pptx-layout="schematic-title" data-pptx-layout-name="Schematic Title">
<rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
<rect id="title-only-rule" x="64" y="120" width="1152" height="2" fill="#E0E0E0" data-pptx-layer="layout"/>
<g id="title-only-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 40 1152 72">
  <text data-pptx-carrier="true" x="64" y="90" font-size="50" font-weight="bold" fill="#161616">Hardware micro-architecture trade-off study</text>
</g>
<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28">
  <text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">12 / 15</text>
</g>
<g id="arch-a-panel" data-pptx-bounds="64 150 552 480">
  <rect x="64" y="150" width="552" height="480" rx="4" fill="#F4F4F4"/>
  <text x="88" y="196" font-size="26" font-weight="bold" fill="#002D9C">ARCH A: PARALLEL DSP</text>
  <text x="88" y="246" font-size="22" font-weight="bold" fill="#0F62FE">Dedicated Multipliers per Feature</text>
  <text x="88" y="290" font-size="20" fill="#161616">• Parallel multipliers for Δday and Δ3h</text>
  <text x="88" y="330" font-size="20" fill="#161616">• Latency: 2 clock cycles</text>
  <text x="88" y="370" font-size="20" fill="#161616">• Throughput: 1 prediction / clock cycle</text>
  <text x="88" y="410" font-size="20" fill="#161616">• Cost: Higher DSP slice / LUT count</text>
  <line x1="88" y1="450" x2="584" y2="450" stroke="#E0E0E0"/>
  <text x="88" y="490" font-size="22" font-weight="bold" fill="#161616">Target Application:</text>
  <text x="88" y="530" font-size="20" fill="#525252">High-speed sensor streams &amp; multi-channel<tspan x="88" dy="28">real-time thermal monitoring.</tspan></text>
</g>
<g id="arch-b-panel" data-pptx-bounds="664 150 552 480">
  <rect x="664" y="150" width="552" height="480" rx="4" fill="#F4F4F4"/>
  <text x="688" y="196" font-size="26" font-weight="bold" fill="#002D9C">ARCH B: SHARED-MAC FSM</text>
  <text x="688" y="246" font-size="22" font-weight="bold" fill="#0F62FE">Time-Multiplexed Single Multiplier</text>
  <text x="688" y="290" font-size="20" fill="#161616">• 1 shared multiplier-accumulator (MAC)</text>
  <text x="688" y="330" font-size="20" fill="#161616">• FSM controller cycles through tap inputs</text>
  <text x="688" y="370" font-size="20" fill="#161616">• Latency: N+2 cycles (e.g. 5–6 cycles)</text>
  <text x="688" y="410" font-size="20" fill="#161616">• Cost: Ultra-compact (1 DSP slice or 0 DSPs)</text>
  <line x1="688" y1="450" x2="1184" y2="450" stroke="#E0E0E0"/>
  <text x="688" y="490" font-size="22" font-weight="bold" fill="#161616">Target Application:</text>
  <text x="688" y="530" font-size="20" fill="#525252">Ultra-low-power, area-constrained edge devices<tspan x="688" dy="28">&amp; battery-operated IoT weather stations.</tspan></text>
</g>
</svg>
