<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="28" data-pptx-master="presentation_core_master" data-pptx-master-name="Presentation Core" data-pptx-layout="schematic-title" data-pptx-layout-name="Schematic Title">
<rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
<rect id="title-only-rule" x="64" y="120" width="1152" height="2" fill="#E0E0E0" data-pptx-layer="layout"/>
<g id="title-only-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 40 1152 72">
  <text data-pptx-carrier="true" x="64" y="90" font-size="50" font-weight="bold" fill="#161616">Linear model with diurnal anchor &amp; taps</text>
</g>
<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28">
  <text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">04 / 15</text>
</g>
<g id="formula-box" data-pptx-bounds="64 136 1152 96">
  <rect x="64" y="136" width="1152" height="96" rx="4" fill="#F4F4F4"/>
  <text x="88" y="196" font-size="30" font-weight="bold" fill="#161616">T̂(t+3) = <tspan fill="#002D9C">T(t−21)</tspan> + a[T(t) − T(t−24)] + b[T(t) − T(t−3)] + c</text>
</g>
<g id="taps-panel" data-pptx-bounds="64 248 560 270">
  <rect x="64" y="248" width="560" height="270" rx="4" fill="#F4F4F4"/>
  <text x="88" y="286" font-size="24" font-weight="bold" fill="#002D9C">TAPS &amp; PHYSICAL MEANING</text>
  <text x="88" y="326" font-size="20" fill="#161616"><tspan font-weight="bold" fill="#0F62FE">T(t−21):</tspan> Diurnal anchor<tspan x="88" dy="24" fill="#525252">Same hour yesterday: (t+3) − 24 = t − 21</tspan></text>
  <text x="88" y="386" font-size="20" fill="#161616"><tspan font-weight="bold" fill="#0F62FE">T(t) − T(t−24):</tspan> Inter-day trend<tspan x="88" dy="24" fill="#525252">Today vs. yesterday at current hour t</tspan></text>
  <text x="88" y="446" font-size="20" fill="#161616"><tspan font-weight="bold" fill="#0F62FE">T(t) − T(t−3):</tspan> Short-term gradient<tspan x="88" dy="24" fill="#525252">Recent 3-hour temperature rate of change</tspan></text>
</g>
<g id="math-walkthrough" data-pptx-bounds="656 248 560 270">
  <rect x="656" y="248" width="560" height="270" rx="4" fill="#F4F4F4"/>
  <text x="680" y="286" font-size="24" font-weight="bold" fill="#002D9C">NUMERICAL ARITHMETIC EXAMPLE</text>
  <text x="680" y="328" font-family="Consolas" font-size="20" fill="#161616">Inputs: T(t−24)=19°C, T(t−21)=21°C<tspan x="680" dy="28">        T(t−3)=18°C,  T(t)=20°C</tspan></text>
  <text x="680" y="390" font-family="Consolas" font-size="20" fill="#525252">Weights: a = 0.5, b = 0.2, c = 0.0°C</text>
  <text x="680" y="430" font-size="24" fill="#161616">21 + 0.5×(1) + 0.2×(2) = <tspan font-size="30" font-weight="bold" fill="#002D9C">21.9°C</tspan></text>
  <text x="680" y="470" font-size="20" font-weight="bold" fill="#0F62FE">Hardware datapath:<tspan x="680" dy="24">Subtract  →  Multiply  →  Adder Tree</tspan></text>
</g>
<g id="bottom-note" data-pptx-bounds="64 532 1152 90" font-size="20" fill="#525252">
  <text x="64" y="558">Requires 25-sample buffer (t−24 to t). Future target T(t+3) strictly stays on host PC for scoring.<tspan x="64" dy="26">NASA POWER hourly T2M data verified for gaps before buffering.</tspan></text>
</g>
<g id="source-link" data-pptx-bounds="64 635 1030 35">
  <a href="https://power.larc.nasa.gov/docs/services/api/temporal/hourly/"><text x="64" y="660" font-size="16" fill="#0F62FE">Planned source: NASA POWER — hourly API documentation</text></a>
</g>
</svg>
