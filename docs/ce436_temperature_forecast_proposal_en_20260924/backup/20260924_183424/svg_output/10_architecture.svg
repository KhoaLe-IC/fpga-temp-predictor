<g id="demo-diagram" data-pptx-bounds="64 160 1152 350">
  <rect x="64" y="160" width="340" height="320" rx="4" fill="#F4F4F4"/>
  <text x="88" y="210" font-size="26" font-weight="bold" fill="#002D9C">HOST PC (PYTHON/C++)</text>
  <text x="88" y="260" font-size="22" fill="#161616">• Reads chronological CSV</text>
  <text x="88" y="300" font-size="22" fill="#161616">• Sends samples up to time t</text>
  <text x="88" y="340" font-size="22" fill="#161616">• Holds T(t+3) for scoring</text>
  <text x="88" y="390" font-size="22" font-weight="bold" fill="#0F62FE">Live Visual Dashboard</text>
  
  <line x1="404" y1="280" x2="480" y2="280" stroke="#0F62FE" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="265" font-size="18" fill="#525252">UART TX: T(t)</text>
  
  <rect x="490" y="160" width="300" height="320" rx="4" fill="#F4F4F4"/>
  <text x="514" y="210" font-size="26" font-weight="bold" fill="#002D9C">FPGA BOARD</text>
  <text x="514" y="260" font-size="22" fill="#161616">• UART RX module</text>
  <text x="514" y="300" font-size="22" fill="#161616">• 25-stage shift register</text>
  <text x="514" y="340" font-size="22" fill="#161616">• Computes T̂(t+3)</text>
  <text x="514" y="380" font-size="22" fill="#161616">• UART TX module</text>
  
  <line x1="790" y1="360" x2="866" y2="360" stroke="#0F62FE" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="796" y="345" font-size="18" fill="#525252">UART RX: T̂(t+3)</text>

  <rect x="876" y="160" width="340" height="320" rx="4" fill="#F4F4F4"/>
  <text x="900" y="210" font-size="24" font-weight="bold" fill="#002D9C">SCOREBOARD &amp; PLOT</text>
  <text x="900" y="260" font-size="22" fill="#161616">• Matches forecast with label</text>
  <text x="900" y="300" font-size="22" fill="#161616">• Calculates real-time MAE</text>
  <text x="900" y="340" font-size="22" fill="#161616">• Plots predicted vs. true curve</text>
  <text x="900" y="390" font-size="22" font-weight="bold" fill="#002D9C">No Look-Ahead Leakage!</text>
</g>
<g id="demo-principle" data-pptx-bounds="64 540 1152 110" font-size="22" fill="#525252">
  <text x="64" y="575">Accelerated Replay: Samples transmitted milliseconds apart instead of hours apart.<tspan x="64" dy="32">Enables full demo of 1,000+ predictions in under 2 minutes during the final presentation.</tspan><tspan x="64" dy="32">Future label T(t+3) never enters the FPGA; strictly preserved on host PC for verification.</tspan></text>
</g>
