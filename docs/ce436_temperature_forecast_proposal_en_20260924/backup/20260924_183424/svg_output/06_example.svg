<rect id="title-only-rule" x="64" y="120" width="1152" height="2" fill="#E0E0E0" data-pptx-layer="layout"/>
<g id="title-only-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 40 1152 72">
  <text data-pptx-carrier="true" x="64" y="90" font-size="50" font-weight="bold" fill="#161616">Algorithmic baseline benchmarking</text>
</g>
<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28">
  <text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">06 / 15</text>
</g>
<g id="left-card" data-pptx-bounds="64 150 552 480">
  <rect x="64" y="150" width="552" height="480" rx="4" fill="#F4F4F4"/>
  <text x="88" y="196" font-size="26" font-weight="bold" fill="#002D9C">IS THE FORECAST USEFUL?</text>
  <text x="88" y="246" font-weight="bold" fill="#161616">Evaluation Metric: MAE (°C)</text>
  <text x="88" y="286" font-size="22" fill="#525252">Mean Absolute Error across all test hours:</text>
  <text x="88" y="335" font-family="Consolas" font-size="24" fill="#002D9C">MAE = (1/N) ∑ |T̂(i) − T_true(i)|</text>
  <line x1="88" y1="380" x2="584" y2="380" stroke="#E0E0E0"/>
  <text x="88" y="425" font-size="24" font-weight="bold" fill="#161616">Core Evaluation Question:</text>
  <text x="88" y="470" font-size="22" fill="#161616">Does our hardware linear model actually<tspan x="88" dy="30">outperform simple no-math heuristics?</tspan></text>
</g>
<g id="right-card" data-pptx-bounds="664 150 552 480">
  <rect x="664" y="150" width="552" height="480" rx="4" fill="#F4F4F4"/>
  <text x="688" y="196" font-size="26" font-weight="bold" fill="#002D9C">TWO NAIVE BASELINES</text>
  <text x="688" y="246" font-weight="bold" fill="#161616">Baseline 1: Persistence T(t)</text>
  <text x="688" y="284" font-size="22" fill="#525252">Assumes temperature stays unchanged.<tspan x="688" dy="28">Predicts: T̂(t+3) = T(t)</tspan></text>
  <text x="688" y="354" font-weight="bold" fill="#161616">Baseline 2: Diurnal T(t−21)</text>
  <text x="688" y="392" font-size="22" fill="#525252">Assumes today repeats yesterday.<tspan x="688" dy="28">Predicts: T̂(t+3) = T(t−21)</tspan></text>
  <line x1="688" y1="454" x2="1184" y2="454" stroke="#E0E0E0"/>
  <text x="688" y="495" font-size="22" font-weight="bold" fill="#0F62FE">Honest Scientific Standard:</text>
  <text x="688" y="535" font-size="22" fill="#525252">If the linear model does not beat baselines,<tspan x="688" dy="28">we analyze residuals and report honestly.</tspan></text>
</g>
<g id="baseline-source" data-pptx-bounds="64 645 1040 34">
  <a href="https://otexts.com/fpp3/simple-methods.html"><text x="64" y="670" font-size="16" fill="#0F62FE">Baseline reference: Forecasting: Principles and Practice — Simple forecasting methods</text></a>
</g>
</svg>
