<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="28" data-pptx-master="presentation_core_master" data-pptx-master-name="Presentation Core" data-pptx-layout="schematic-title" data-pptx-layout-name="Schematic Title">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#0F62FE" /></marker></defs>
<rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false" />
<rect id="title-only-rule" x="64" y="120" width="1152" height="2" fill="#E0E0E0" data-pptx-layer="layout" />
<g id="title-only-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 40 1152 72">
  <text data-pptx-carrier="true" x="64" y="90" font-size="50" font-weight="bold" fill="#161616">Hardware Architecture &amp; Datapath</text>
</g>
<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28">
  <text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">09 / 15</text>
</g>
<g id="sample-buffer" data-pptx-bounds="64 150 360 380">
  <rect x="64" y="150" width="360" height="380" rx="4" fill="#F4F4F4" />
  <text x="88" y="200" font-weight="bold" fill="#002D9C">25-SAMPLE BUFFER</text>
  <text x="88" y="255" font-size="24" fill="#161616">Shift Reg: T(t−24)…T(t)</text>
  <line x1="88" y1="285" x2="396" y2="285" stroke="#E0E0E0" />
  <text x="88" y="330" font-size="24" font-weight="bold" fill="#161616">Required Hardware Taps:</text>
  <text x="88" y="375" font-size="24" fill="#161616">• t − 24  (Yesterday baseline)</text>
  <text x="88" y="420" font-size="24" fill="#161616">• t − 21  (Diurnal anchor)</text>
  <text x="88" y="465" font-size="24" fill="#161616">• t − 3   (Recent 3h change)</text>
  <text x="88" y="505" font-size="24" fill="#161616">• t       (Current sample)</text>
</g>
<g id="arithmetic-path" data-pptx-bounds="450 150 766 380">
  <rect x="450" y="150" width="766" height="380" rx="4" fill="#F4F4F4" />
  <text x="474" y="200" font-weight="bold" fill="#002D9C">PIPELINED ARITHMETIC DATAPATH</text>
  <text x="474" y="260" font-size="26" fill="#161616">• Branch 1: [ T(t) − T(t−24) ] × a  (Inter-day change)</text>
  <text x="474" y="315" font-size="26" fill="#161616">• Branch 2: [ T(t) − T(t−3)  ] × b  (3-hour rate of change)</text>
  <line x1="474" y1="355" x2="1184" y2="355" stroke="#E0E0E0" />
  <text x="474" y="410" font-weight="bold" fill="#002D9C">Adder Tree: T(t−21) + Br₁ + Br₂ + c  →  T̂(t+3)</text>
  <text x="474" y="465" font-size="24" fill="#525252">• Saturation logic prevents arithmetic wrap-around on overflow</text>
  <text x="474" y="505" font-size="24" fill="#525252">• Forecast valid asserted only after 25 samples are buffered</text>
</g>
<g id="control-contract" data-pptx-bounds="64 555 1152 75">
  <rect x="64" y="555" width="1152" height="75" rx="4" fill="#F4F4F4" />
  <text x="88" y="602" font-size="26" font-weight="bold" fill="#0F62FE">Hardware latency: 2–4 clock cycles (nanoseconds)  ·  Data step: 1 sample = 1 hour</text>
</g>
</svg>
