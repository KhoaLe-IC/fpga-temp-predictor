<g id="regression-inputs" data-pptx-bounds="64 152 1152 166"><rect x="64" y="152" width="1152" height="166" fill="#F4F4F4"/><text x="88" y="195" font-family="Consolas" font-size="26" fill="#161616">x₁ =</text><text x="170" y="195" font-family="Consolas" font-size="26" fill="#161616">T(t)−T(t−24)</text><text x="650" y="195" font-family="Consolas" font-size="26" fill="#161616">x₂ =</text><text x="732" y="195" font-family="Consolas" font-size="26" fill="#161616">T(t)−T(t−3)</text><text x="88" y="250" font-family="Consolas" font-size="26" fill="#161616">y =</text><text x="170" y="250" font-family="Consolas" font-size="26" fill="#161616">T(t+3)−T(t−21)</text><text x="88" y="297" font-family="Arial" font-size="28" fill="#161616">C++ fits a, b, c by least squares.</text><text x="650" y="250" fill="#002D9C" font-family="Arial" font-size="24">y = a*x1 + b*x2 + c</text></g>
<g id="train-stage" data-pptx-bounds="64 354 350 176"><line x1="64" y1="356" x2="410" y2="356" stroke="#0F62FE" stroke-width="4"/><text x="64" y="402" font-size="30" font-weight="bold" fill="#161616">01  TRAIN</text><text x="64" y="453" fill="#161616">Fit coefficients<tspan x="64" dy="38">on earlier data</tspan></text></g>
