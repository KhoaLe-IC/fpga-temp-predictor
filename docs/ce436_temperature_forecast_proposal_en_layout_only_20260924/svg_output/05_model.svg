<g id="page-number" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1140 668 76 28"><text data-pptx-carrier="true" x="1216" y="688" text-anchor="end" font-size="16" fill="#525252">05 / 15</text></g>
<g id="forecast-equation" data-pptx-bounds="64 156 1152 168"><rect x="64" y="156" width="1152" height="168" fill="#F4F4F4"/><text x="92" y="216" font-size="38" font-weight="bold" fill="#161616">T̂(t+3) = T(t−21) + a[T(t)−T(t−24)]</text><text x="281" y="280" font-size="38" font-weight="bold" fill="#002D9C">+ b[T(t)−T(t−3)] + c</text></g>
<g id="seasonal-base" data-pptx-bounds="64 360 342 208"><line x1="64" y1="364" x2="400" y2="364" stroke="#0F62FE" stroke-width="3"/><text x="64" y="413" font-size="32" font-weight="bold" fill="#161616">T(t−21)</text><text x="64" y="464" fill="#161616">Same-hour anchor<tspan x="64" dy="38">on the previous day</tspan></text></g>
<g id="day-difference" data-pptx-bounds="448 360 360 208"><line x1="448" y1="364" x2="784" y2="364" stroke="#0F62FE" stroke-width="3"/><text x="448" y="413" font-size="32" font-weight="bold" fill="#161616">a[T(t)−T(t−24)]</text><text x="448" y="464" fill="#161616">Correction for day-to-day<tspan x="448" dy="38">difference</tspan></text></g>
<g id="recent-trend" data-pptx-bounds="832 360 384 208"><line x1="832" y1="364" x2="1216" y2="364" stroke="#0F62FE" stroke-width="3"/><text x="832" y="413" font-size="32" font-weight="bold" fill="#161616">b[T(t)−T(t−3)]</text><text x="832" y="464" fill="#161616">Correction for recent<tspan x="832" dy="38">3-hour change</tspan></text></g>
<g id="coefficient-contract" data-pptx-bounds="64 588 1152 76" fill="#525252" font-size="22"><text x="64" y="618">c is a constant offset. C++ fits a, b, c offline; FPGA uses them unchanged.<tspan x="64" dy="32">Proposed model only; no fitted coefficients or measured results yet.</tspan></text></g>
