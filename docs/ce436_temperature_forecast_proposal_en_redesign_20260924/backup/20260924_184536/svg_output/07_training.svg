<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" /><g id="header" data-pptx-bounds="64 40 1152 100"><text x="64" y="93" font-size="49" fill="#161616" font-weight="bold">Train on the past. Test on the future.</text><line x1="64" y1="127" x2="1216" y2="127" stroke="#DDE1E6" stroke-width="2" /><rect x="64" y="127" width="86" height="5" fill="#0F62FE" /></g><g id="footer" data-pptx-bounds="1100 655 116 40"><text x="1216" y="682" font-size="19" fill="#525252" font-weight="normal" text-anchor="end">07 / 15</text></g><g id="regression" data-pptx-bounds="64 150 1152 500"><rect x="64" y="176" width="1152" height="183" fill="#F4F4F4" /><text x="91" y="235" font-size="35" fill="#161616" font-weight="normal" font-family="Consolas">x1 = T(t) − T(t−24)</text><text x="91" y="299" font-size="35" fill="#161616" font-weight="normal" font-family="Consolas">x2 = T(t) − T(t−3)</text><text x="668" y="260" font-size="37" fill="#002D9C" font-weight="bold">y = a·x1 + b·x2 + c</text><text x="668" y="315" font-size="27" fill="#525252" font-weight="normal">fit a, b, c by least squares</text><rect x="64" y="423" width="338" height="145" fill="#F4F4F4" /><rect x="64" y="423" width="338" height="7" fill="#0F62FE" /><text x="84" y="483" font-size="30" fill="#161616" font-weight="bold">01 TRAIN</text><text x="84" y="533" font-size="28" fill="#525252" font-weight="normal">fit coefficients</text><rect x="466" y="423" width="338" height="145" fill="#F4F4F4" /><rect x="466" y="423" width="338" height="7" fill="#525252" /><text x="486" y="483" font-size="30" fill="#161616" font-weight="bold">02 VALIDATE</text><text x="486" y="533" font-size="28" fill="#525252" font-weight="normal">select settings</text><rect x="868" y="423" width="348" height="145" fill="#F4F4F4" /><rect x="868" y="423" width="348" height="7" fill="#0F62FE" /><text x="888" y="483" font-size="30" fill="#161616" font-weight="bold">03 TEST</text><text x="888" y="533" font-size="28" fill="#525252" font-weight="normal">evaluate once</text><text x="64" y="638" font-size="27" fill="#525252" font-weight="normal">Split chronologically; training labels must not cross into later periods.</text></g></svg>
