<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" /><g id="header" data-pptx-bounds="64 40 1152 100"><text x="64" y="93" font-size="49" fill="#161616" font-weight="bold">A linear model from past values</text><line x1="64" y1="127" x2="1216" y2="127" stroke="#DDE1E6" stroke-width="2" /><rect x="64" y="127" width="86" height="5" fill="#0F62FE" /></g><g id="footer" data-pptx-bounds="1100 655 116 40"><text x="1216" y="682" font-size="19" fill="#525252" font-weight="normal" text-anchor="end">05 / 15</text></g><g id="model-equation" data-pptx-bounds="64 150 1152 500"><rect x="64" y="177" width="1152" height="306" fill="#F4F4F4" /><text x="96" y="260" font-size="47" fill="#161616" font-weight="bold" font-family="Consolas">T̂(t+3) = T(t−21)</text><text x="96" y="346" font-size="47" fill="#002D9C" font-weight="bold" font-family="Consolas">+ a[T(t)−T(t−24)]</text><text x="96" y="432" font-size="47" fill="#002D9C" font-weight="bold" font-family="Consolas">+ b[T(t)−T(t−3)] + c</text><rect x="64" y="523" width="338" height="8" fill="#0F62FE" /><text x="64" y="570" font-size="26" fill="#002D9C" font-weight="bold">ANCHOR</text><text x="64" y="612" font-size="27" fill="#525252" font-weight="normal">same hour yesterday</text><rect x="466" y="523" width="338" height="8" fill="#0F62FE" /><text x="466" y="570" font-size="26" fill="#002D9C" font-weight="bold">DAY-TO-DAY</text><text x="466" y="612" font-size="27" fill="#525252" font-weight="normal">current vs. yesterday</text><rect x="868" y="523" width="348" height="8" fill="#0F62FE" /><text x="868" y="570" font-size="26" fill="#002D9C" font-weight="bold">RECENT CHANGE</text><text x="868" y="612" font-size="27" fill="#525252" font-weight="normal">latest 3 hours</text></g></svg>
