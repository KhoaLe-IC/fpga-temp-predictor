<g id="regression-inputs" data-pptx-bounds="64 152 1152 166"><rect x="64" y="152" width="1152" height="166" fill="#F4F4F4" /><text x="88" y="195" font-family="Consolas" font-size="26" fill="#161616">x₁ =</text><text x="170" y="195" font-family="Consolas" font-size="26" fill="#161616">T(t)−T(t−24)</text><text x="650" y="195" font-family="Consolas" font-size="26" fill="#161616">x₂ =</text><text x="732" y="195" font-family="Consolas" font-size="26" fill="#161616">T(t)−T(t−3)</text><text x="88" y="250" font-family="Consolas" font-size="26" fill="#161616">y =</text><text x="170" y="250" font-family="Consolas" font-size="26" fill="#161616">T(t+3)−T(t−21)</text><text x="650" y="250" font-family="Consolas" font-size="24" fill="#002D9C">y ≈ ax₁ + bx₂ + c</text><text x="88" y="297" font-family="Arial" font-size="28" fill="#161616">C++ tìm a, b, c bằng bình phương tối thiểu.</text></g>
<g id="train-stage" data-pptx-bounds="64 354 350 176"><line x1="64" y1="356" x2="410" y2="356" stroke="#0F62FE" stroke-width="4" /><text x="64" y="402" font-size="30" font-weight="bold" fill="#161616">01  TRAIN</text><text x="64" y="453" fill="#161616">Tìm hệ số<tspan x="64" dy="38">trên dữ liệu cũ</tspan></text></g>
<g id="validation-stage" data-pptx-bounds="464 354 350 176"><line x1="464" y1="356" x2="810" y2="356" stroke="#525252" stroke-width="4" /><text x="464" y="402" font-size="30" font-weight="bold" fill="#161616">02  VALIDATION</text><text x="464" y="453" fill="#161616">Chọn đặc trưng<tspan x="464" dy="38">và cấu hình</tspan></text></g>
<g id="test-stage" data-pptx-bounds="864 354 352 176"><line x1="864" y1="356" x2="1216" y2="356" stroke="#002D9C" stroke-width="4" /><text x="864" y="402" font-size="30" font-weight="bold" fill="#161616">03  TEST</text><text x="864" y="453" fill="#161616">Đánh giá cuối<tspan x="864" dy="38">trên giai đoạn mới</tspan></text></g>
<g id="split-contract" data-pptx-bounds="64 544 1152 106" font-size="22" fill="#525252"><text x="64" y="574">Chia theo thời gian của nhãn; nhãn train không đi vào giai đoạn validation/test.<tspan x="64" dy="29">Có thể dùng lịch sử đã quan sát ở giai đoạn trước. Chưa chốt tỷ lệ hoặc khoảng dữ liệu.</tspan><tspan x="64" dy="29">Các vùng trên chỉ thể hiện thứ tự; C++ có thể dùng thư viện Eigen để giải least squares.</tspan></text></g>
<g id="training-source" data-pptx-bounds="64 658 1040 34"><a href="https://eigen.tuxfamily.org/dox/group__LeastSquares.html"><text x="64" y="681" font-size="16" fill="#0F62FE">Tài liệu triển khai: Eigen — Solving linear least squares systems</text></a></g>
